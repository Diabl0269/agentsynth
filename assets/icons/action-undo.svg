    <path d="M4 10H14A6 6 0 0 1 14 22" stroke-width="2.6" fill="none" stroke="#FF00FF" stroke-linecap="round" />
    <path d="M9 6L4 10L9 14" stroke-width="2.6" fill="none" stroke="#FF00FF" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
