<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Toolbar icon, ai group: a patch cable ending in a jack plug. Colour roles are placeholders the icon library replaces: #FF00FF = group colour (fill-opacity .45 = soft), #00FFFF = ink, #FFFF00 = paper. The metal tip keeps its own greys. The signal pulse, plug glow and spark at the plug are drawn in code (ToolbarAiSpark.cpp) so they can loop. -->
  <path d="M3 21 C3 14 8 18 12 13" stroke="#FF00FF" stroke-width="2.4" fill="none" stroke-linecap="round" />
  <g transform="translate(12 13) rotate(-48)">
    <rect x="-.5" y="-2.6" width="5" height="5.2" rx="1.2" fill="#FF00FF" />
    <rect x="4" y="-1.1" width="4.6" height="2.2" rx="1" fill="#E6E9EE" stroke="#8A93A0" stroke-width=".4" />
    <rect x="4.9" y="-1.1" width="1" height="2.2" fill="#8A93A0" />
  </g>
</svg>
