    <g id="mv">
      <rect x="7" y="7.8" width="10" height="1.9" rx=".95" fill="#FF00FF" />
      <rect x="7" y="11.2" width="6.2" height="1.9" rx=".95" fill="#FF00FF" />
    </g>
  </g>
</svg>
