<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Toolbar icon, view group. Colour roles are placeholders the icon library replaces: #FF00FF = group colour (fill-opacity .45 = soft), #00FFFF = ink, #FFFF00 = paper. The group with id mv moves on hover. -->
  <circle cx="10" cy="10" r="6.3" fill="#FF00FF" fill-opacity=".45" />
  <circle cx="10" cy="10" r="6.3" fill="none" stroke="#FF00FF" stroke-width="2.2" />
  <path d="M6.9 9.2a3.4 3.4 0 0 1 2.5-2.4" fill="none" stroke="#FFFF00" stroke-width="1.5" stroke-linecap="round" />
  <g id="mv">
    <path d="M14.8 14.8l5 5" fill="none" stroke="#FF00FF" stroke-width="3.2" stroke-linecap="round" />
    <path d="M15.6 15.6l1.6 1.6" fill="none" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
