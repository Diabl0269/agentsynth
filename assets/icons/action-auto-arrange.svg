  <g id="mv">
    <rect x="13" y="3.5" width="7.5" height="5" rx="2" fill="#FF00FF" fill-opacity=".45" />
  </g>
  <rect x="3.5" y="13" width="7.5" height="7.5" rx="2" fill="#FF00FF" fill-opacity=".45" />
  <g id="mv2">
    <rect x="13" y="10.5" width="7.5" height="10" rx="2" fill="#FF00FF" />
  </g>
</svg>
