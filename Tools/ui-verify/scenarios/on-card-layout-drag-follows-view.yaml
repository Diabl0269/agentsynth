# A control dragged in the on-card layout editor stopped at the edge of the canvas view, so a card cut by that edge
# could not take a drop below it, nor on its "Drop to hide" area; now the canvas scrolls along while the pointer is
# held there and the control's ghost stays under the pointer.
#
# What a user does: opens a patch whose Filter card reaches near the bottom of the view, right-clicks the card's title
# and picks Edit Layout..., grabs the Cutoff knob's grip and drags it to the bottom edge of the canvas and holds it:
# the canvas scrolls up and the area below the card (Add control, Drop to hide) comes into view. Escape cancels the
# drag and the layout is unchanged.
record: true
save_project: on-card-layout-drag-follows-view
steps:
  - openProject: {path: "${FIXTURES}/lane-edge.agsproj"}
  - wait: {}
  - click: {id: "card:Filter", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  # The card menu: Copy, Duplicate, Save as Snippet..., Bypass Module, Edit Layout... (disabled items are skipped).
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - screenshot: {name: editor-open}
  - mouseDown: {id: window, x: 890, y: 520}
  - mouseMoveHeld: {id: window, x: 890, y: 640}
  - mouseMoveHeld: {id: window, x: 890, y: 800}
  - glide: {name: control-held-at-edge, frames: 16, do: {mouseMoveHeld: {id: window, x: 890, y: 871}}}
  - mark: {check: 1, name: control-drag-scrolls-the-canvas}
  - key: {keys: escape}
  - wait: {}
  - screenshot: {name: escape-cancels}
  - mouseUp: {id: window, x: 890, y: 871}
