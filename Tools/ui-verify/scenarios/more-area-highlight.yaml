# A card's open "More controls" area carries a soft accent wash and a hairline, fading in with the row and out when
# it folds; a folded card has none.
#
# What a user does:
#   1. Starts a new project and adds a Parametric EQ and a Distortion (the EQ has no More row, so the Distortion carries it).
#   2. Clicks the Distortion's "More controls" button: the row opens and the button and the controls under it
#      sit on a faint accent wash with a hairline edge.
#   3. Clicks it again: the row folds and the wash fades out.
motion: true
record: true
save_project: more-area-highlight
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f, instant: "focus ring and caret appear on the library search field"}
  - wait: {}
  - key: {keys: cmd+a, instant: "the text selection highlight appears in the library search field"}
  - type: {text: parametric}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f, instant: "the caret moves in the library search field"}
  - wait: {}
  - key: {keys: cmd+a, instant: "the text selection highlight appears in the library search field"}
  - type: {text: dist}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return, instant: "setup: the added card appears and the canvas re-centres on it"}
  - wait: {}
  - click: {id: Hide Panel}
  - wait: {}
  - key: {keys: "cmd+-"}
  - key: {keys: "cmd+-"}
  - wait: {}
  - screenshot: {name: folded-before}
  - glide: {name: more-opens, frames: 14, do: {click: {id: "card:Distortion > cardMoreRow"}}}
  - wait: {}
  - hover: {id: window, x: 700, y: 780}   # the tooltip would cover the revealed controls
  - wait: {timeoutMs: 1000, settleMs: 1000}
  - screenshot: {name: open-after}
  - mark: {check: 1, name: more-area-highlight}
  - glide: {name: more-folds, frames: 14, do: {click: {id: "card:Distortion > cardMoreRow"}}}
  - wait: {}
  - hover: {id: window, x: 700, y: 780}
  - wait: {timeoutMs: 1000, settleMs: 1000}
  - mark: {check: 2, name: more-area-folded}
