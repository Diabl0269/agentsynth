# FRO2057: the alert box's icon follows the Depth setting (Flat, Soft, Rich) in the obsidian theme.
#
# What a user does: in Settings > Appearance > Controls > Depth picks Flat, Soft and Rich, then clicks Keyboard Shortcuts >
# Reset to Defaults. The "Reset Shortcuts" warning shows its icon: a bare triangle with "!" at every level, never in a
# round: Flat no shadow, Soft a small shadow, Rich the same outline with a top light, darker foot and deeper shadow
# (Rich never adds a shape). Proof marks:
# check 3, the alert at each level (depth-alerts-obsidian-flat, -soft, -rich).
