# Sections motion: shortening a clip in one repeat of a section slides the same clip in every other repeat to the new
# length, instead of popping it there.
#
# What a user does: adds an Oscillator track and a one-bar clip, makes a section "Chorus" over bar 1 and places it again
# twice with Cmd+D (three Choruses back to back), then drags the right edge of the clip in the second Chorus one beat
# shorter and lets go: the clips in the first and third Chorus glide to the new length.
record: true
motion: true
save_project: "fro1531 test"
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  - click: {id: timelineClipLaneArea, x: 50, y: 28, clicks: 2}
  - wait: {}
  - expect: {id: timelineClipPitches, clipLengths: "Clip 1:4.000", within_ms: 2000}
  - key: {keys: escape}
  - wait: {}
  # "Chorus" over bar 1 (x 0..96), then Cmd+D twice: three Choruses back to back.
  - mouseDown: {id: timelineSectionStrip, x: 5, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 90, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 90, y: 12}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 1:0.000:4.000:1/1", within_ms: 2000}
  # Under motion the runner clicks Undo and Redo after every edit (closing the name editor the drag opened), so the
  # block is named by a double-click.
  - click: {id: timelineSectionStrip, x: 40, y: 12, clicks: 2}
  - wait: {}
  - type: {text: "Chorus"}
  - key: {keys: return}
  - wait: {}
  - expect: {id: timelineSections, sections: "Chorus:0.000:4.000:1/1", within_ms: 2000}
  - click: {id: timelineSectionStrip, x: 40, y: 12}
  - key: {keys: cmd+d}
  - wait: {}
  - expect: {id: timelineSections, sections: "Chorus:0.000:4.000:1/2;Chorus:4.000:4.000:2/2", within_ms: 2000}
  - click: {id: timelineSectionStrip, x: 136, y: 12}
  - key: {keys: cmd+d}
  - wait: {}
  - expect: {id: timelineSections, sections: "Chorus:0.000:4.000:1/3;Chorus:4.000:4.000:2/3;Chorus:8.000:4.000:3/3", within_ms: 2000}
  - expect: {id: timelineClipPitches, clipLengths: "Clip 1:4.000;Clip 1:4.000;Clip 1:4.000", within_ms: 2000}
  # Check 1: the right edge of the clip in the second Chorus (beat 8 = x 192) one beat shorter; on release the
  # other two repeats glide to the new length with it.
  - mouseDown: {id: timelineClipLaneArea, x: 191, y: 50}
  - mouseMoveHeld: {id: timelineClipLaneArea, x: 180, y: 50}
  - mouseMoveHeld: {id: timelineClipLaneArea, x: 167, y: 50}
  - wait: {}
  - glide: {name: repeats-glide, do: {mouseUp: {id: timelineClipLaneArea, x: 167, y: 50}}, frames: 8, crop: {x: 190, y: 700, w: 420, h: 150}}
  - wait: {}
  - expect: {id: timelineClipPitches, clipLengths: "Clip 1:3.000;Clip 1:3.000;Clip 1:3.000", within_ms: 2000}
  - mark: {check: 1, name: repeats-glide}
