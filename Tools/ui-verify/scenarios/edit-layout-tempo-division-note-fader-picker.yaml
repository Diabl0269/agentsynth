# A Tempo-look division is a vertical note-length fader with an S | T | D picker under it, in Shared and in
# Separate looks, and its Edit Layout panel offers Show as, Direction and Fader size (the Shared look's panel used
# to offer only Label and Hide from card).
record: true
save_project: fro1341 tempo division note fader picker
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - key: {keys: "cmd+-"}
  - wait: {}
  - wheel: {id: window, x: 800, y: 450, dx: 0, dy: 1.2}
  - wait: {}
  - click: {id: window, x: 1188, y: 350}
  - wait: {settleMs: 600}
  - screenshot: {id: screen, name: card-in-tempo-with-picker}
  - click: {id: "card:ADSR 3", x: 60, y: 10, button: right}
  - wait: {settleMs: 300}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 500}
  - click: {id: window, x: 1188, y: 350}
  - wait: {settleMs: 600}
  - screenshot: {id: screen, name: tempo-look-faders-with-picker}
  - click: {id: window, x: 1095, y: 400, clicks: 2}
  - wait: {settleMs: 500}
