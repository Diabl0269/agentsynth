# Bug FRO1094: Add Track (Cmd+T, or Ctrl+T) pressed with the timeline panel closed opened its picker at the bottom of
# the window: the picker was launched while the panel was still sliding in, so it anchored to where "+ Track" was
# before the slide. It now waits for the slide (hence `motion: true`: animations are on in this scenario).
#
# What a user does: with the timeline closed, presses Cmd+T. The panel slides open and the picker appears beside the
# Add Track button, vertically level with it (the picker is a call-out window, so its own PNG is saved next to the
# window's).
motion: true
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - expect: {id: modMatrixPicker, exists: false}
  - key: {keys: cmd+t}
  - expect: {id: modMatrixPicker, showing: true, within_ms: 4000}
  - wait: {}
  - expect: {id: timelineAddTrackButton, bounds: {x: 2, y: 716, w: 196, h: 26}}
  - screenshot: {name: cmd-t-closed-window}
  - screenshot: {id: modMatrixPicker, name: cmd-t-closed-picker}
