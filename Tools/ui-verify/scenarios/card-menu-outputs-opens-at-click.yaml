# A panel opened from a card's right-click menu opens where you clicked, not at the card's own button (FRO1806).
#
# What a user does:
#   1. Opens a project with a Maschine 2 card (16 stereo outputs) near the top of the canvas.
#   2. Right-clicks the card's body and chooses Outputs...: the panel opens at the click and fits on the screen.
#   3. Closes it and presses the card's Outputs button: the panel opens at that button, as before.
motion: true
record: true
save_project: fro1806-card-menu-outputs
settings:
  pluginScanList: '<KNOWNPLUGINS><PLUGIN name="Maschine 2" descriptiveName="Maschine 2" format="AudioUnit" category="Synth" manufacturer="Native Instruments" version="1" file="AudioUnit:Synths/aumu,NiM2,-NI-" uniqueId="0" isInstrument="1" numInputs="0" numOutputs="2" isShell="0" hasARA="0" uid="0"/></KNOWNPLUGINS>'
steps:
  - openProject: {path: "${FIXTURES}/hosted-outputs-panel.agsproj"}
  - wait: {}
  - expect: {id: "card:Maschine 2", showing: true, within_ms: 30000}
  - expect: {id: hostedLoadStatus, showing: false, within_ms: 15000}
  - wait: {}
  - glide: {name: menu-open, frames: 12, do: {click: {id: "card:Maschine 2", x: 60, y: 90, button: right}}}
  - wait: {settleMs: 600}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - wait: {settleMs: 300}
  - key: {keys: return, instant: "the picked context menu closes in one step; the panel it opens fades in as its own window"}
  - wait: {settleMs: 600}
  - mark: {check: 1, name: panel-at-click}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - click: {id: outputsButton}
  - wait: {settleMs: 600}
  - mark: {check: 2, name: panel-at-button}
