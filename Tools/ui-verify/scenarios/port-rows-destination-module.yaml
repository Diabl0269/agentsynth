# A mod menu row names its destination with the module and capitalised words: the LFO's output jack lists
# "Drum Kit · Pad 1 Level" and "Drum Kit · Pad 1 Tune" (FRO1760); before, "Pad 1 level" with no module in sight on the
# knob side and a lowercase second word. The names are the Drum Kit's parameter names, so they read the same on the card.
#
# What a user does: adds an LFO beside the Drum Kit, cables its output to Pad 1 Level and Pad 1 Tune, clicks the LFO's
# output jack and reads the rows.
motion: true
record: true
save_project: drum-kit-lfo-names
steps:
  - openProject: {path: "${FIXTURES}/drum-kit-instrument-pad.agsproj"}
  - wait: {}
  - click: {id: Hide Library}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a, instant: "selecting the search text"}
  - type: {text: lfo, instant: "typed text"}
  - wait: {}
  - key: {keys: down, instant: "the highlighted search result moves"}
  - key: {keys: down, instant: "the highlighted search result moves"}
  - key: {keys: return}
  - wait: {}
  - drag: {from: "card:LFO", fromX: 268, fromY: 56, to: "card:Drum Kit > Level: Pluck 1"}
  - wait: {}
  - drag: {from: "card:LFO", fromX: 268, fromY: 56, to: "card:Drum Kit > Tune: Pluck 1"}
  - wait: {}
  - glide: {name: jack-panel-opens, frames: 12, do: {click: {id: "card:LFO", x: 268, y: 56}}}
  - wait: {settleMs: 200}
  - expect: {id: portConnectionsPanel, within_ms: 3000}
  - wait: {settleMs: 300}
  - mark: {check: 1, name: jack-rows}
  - screenshot: {id: portConnectionsPanel, name: lfo-jack-panel}
