# In Edit Layout, a knob dragged onto a row that holds two others joins it. (Rewritten for the lane grids: every
# built-in card is outline-only now, so the scenario uses an Oscillator with a stored row layout, fixture
# edit-layout-rows.agsproj; it asserts the outline says it drags before it drags.)
#
# What a user does: right-clicks the Oscillator's title, picks Edit Layout..., drags Blend (Unison row) down to the
# right of Level and Pan: all three sit in one row. Cmd+Z puts Blend back in one step.
record: true
save_project: Edit Layout rows
steps:
  - copyFixture: {name: "edit-layout-rows.agsproj"}
  - openProject: {path: "${SCRATCH}/edit-layout-rows.agsproj"}
  - wait: {}
  - click: {id: "card:Oscillator", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  # The card menu: Copy, Duplicate, Save as Snippet..., Bypass Module, Edit Layout... (disabled items are skipped).
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - expect: {id: "layoutOutline:blend", contains: {tooltip: "Drag to move"}}
  - expect: {id: "layoutOutline:level", contains: {tooltip: "Drag to move"}}
  - screenshot: {name: editor-open}
  - mouseDown: {id: "layoutOutline:blend"}
  - mouseMoveHeld: {id: "layoutOutline:blend", x: 40, y: 80}
  - mouseMoveHeld: {id: "layoutOutline:pan", x: 150, y: 20}
  - mouseMoveHeld: {id: "layoutOutline:pan", x: 130, y: 50}
  - mouseUp: {id: "layoutOutline:pan", x: 130, y: 50}
  - wait: {}
  - mark: {check: 1, name: blend-joins-the-output-row}
  - key: {keys: cmd+z}
  - wait: {}
  - screenshot: {name: blend-undone}
