# Bug: the Filter card's Show Response curve ignored Drive, and followed only Cutoff's modulation, so it stayed still
# while Resonance, Drive and Custom's Morph X/Y, Shift and Depth moved the sound.
#
# What a user does: adds a Filter, opens Show Response, turns Drive up (the whole curve lifts by the ladder's level
# change), then turns Resonance up (the peak grows). Test mode runs no audio device, so modulation by a cable is
# checked by FrequencyResponseModulationTests, not here; the view reads knob plus CV, so a knob turn shows at once.
record: true
save_project: filter-response-drive
