# FRO1547: Cmd+Z and Cmd+Shift+Z after picking a drum idea animate the hits the way the pick did: the hits the idea
# added shrink out while the ones it replaced grow back, and redo does the same the other way.
#
# What a user does:
#   1. Opens the project with a Drum Kit track and an empty "Beat 1" clip and opens the drum machine.
#   2. Picks the House starter from Ideas: the hits grow in.
#   3. Presses Cmd+Z: the House hits shrink out (the clip is empty again). Presses Cmd+Shift+Z: they grow back.
motion: true
pop_check: {undo: false}   # undo off: the scenario tests undo itself and needs the undo history untouched
record: true
save_project: drum-idea-undo
steps:
  - openProject: {path: "${FIXTURES}/drum-kit-track-clip.agsproj"}
  - wait: {}
  - key: {keys: cmd+t}
  - wait: {}
  - click: {id: trackDrumMachineButton}
  - wait: {}
  - expect: {id: drumMachineState, hitCount: 0}
  - click: {id: drumIdeas}
  - wait: {}
  - click: {id: House}
  - wait: {}
  - key: {keys: escape}
  - wait: {settleMs: 800}
  - expect: {id: drumMachineState, hits: "36:0,4,8,12;39:4,12;42:0,2,6,8,10,14;46:2,6,10,14", within_ms: 1500}
  - screenshot: {name: 1-house-starter}
  - glide: {name: undo-frames, frames: 14, do: {key: {keys: cmd+z}}}
  - wait: {settleMs: 600}
  - mark: {check: 3, name: undo-shrinks}
  - wait: {settleMs: 600}
  - expect: {id: drumMachineState, hitCount: 0, within_ms: 1500}
  - screenshot: {name: 2-after-undo}
  - glide: {name: redo-frames, frames: 14, do: {key: {keys: cmd+shift+z}}}
  - wait: {settleMs: 600}
  - mark: {check: 3, name: redo-grows}
  - wait: {settleMs: 600}
  - expect: {id: drumMachineState, hits: "36:0,4,8,12;39:4,12;42:0,2,6,8,10,14;46:2,6,10,14", within_ms: 1500}
  - screenshot: {name: 3-after-redo}
