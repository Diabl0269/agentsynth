# A card's first lane is titled by what its control does, not "Hero": the Delay reads Time, the Reverb Size, the Gate
# Threshold and the Envelope Follower Sensitivity. Then, on a Mallet, a Limiter and a Chorus, a column with fewer
# knobs than its neighbours (the Mallet's lone Level, the Limiter's two Out knobs, the Chorus's Feedback) sits in the
# middle of the lane's band instead of hanging from the top or the bottom. Checks 1 and 2.
#
# What a user does: opens a project with the four effect cards and reads the lane titles (check 1), then opens a
# project with a Mallet, a Limiter and a Chorus and looks at the short columns (check 2).
record: true
save_project: FRO2354 lane titles and centring
settings:
  themeId: obsidian
  themeMode: Dark
steps:
  - copyFixture: {name: "fro2354-effects.agsproj"}
  - openProject: {path: "${SCRATCH}/fro2354-effects.agsproj"}
  - wait: {}
  - wait: {settleMs: 600}
  - screenshot: {id: "card:Delay", name: delay-time-lane}
  - screenshot: {id: "card:Reverb", name: reverb-size-lane}
  - screenshot: {id: "card:Gate", name: gate-threshold-lane}
  - screenshot: {id: "card:Envelope Follower", name: envelope-follower-sensitivity-lane}
  - mark: {check: 1, name: lane-titles-by-function}
  - copyFixture: {name: "fro2354-mallet.agsproj"}
  - openProject: {path: "${SCRATCH}/fro2354-mallet.agsproj"}
  - wait: {}
  - wait: {settleMs: 600}
  - screenshot: {id: "card:Mallet", name: mallet-partial-out-column}
  - screenshot: {id: "card:Limiter", name: limiter-partial-out-column}
  - screenshot: {id: "card:Chorus", name: chorus-short-column}
  - mark: {check: 2, name: short-columns-centred}
