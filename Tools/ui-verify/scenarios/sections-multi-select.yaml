# Several sections can be selected, the way tracks and clips are: Cmd-click adds a block, Shift-click selects the run
# from the last click, and a drag, Delete or Cmd+D acts on the whole set as one undo step.
#
# What a user does: makes four sections (bar 1, bar 2, bars 3 to 4, bar 5), Cmd-clicks Section 1 and Section 3 and
# drags them right past Section 4: both move as one group and keep the gap between them, and Section 2, which sits in
# that gap, comes along (Section 4 closes up to bar 1). Presses Delete: both go with their bars; Cmd+Z brings them
# back. Clicks Section 4 and Shift-clicks Section 3 (the run 4, 1, 2, 3) and presses Cmd+D: copies of all four land
# after the last one with the same spacing; Option-dragging the run to the end does the same.
record: true
save_project: sections-gapped-group
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  # Four sections: bar 1 (x 0..96), bar 2 (96..192), bars 3 and 4 (192..384), bar 5 (384..480); each opens its name,
  # Return keeps it.
  - mouseDown: {id: timelineSectionStrip, x: 5, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 90, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 90, y: 12}
  - wait: {}
  - key: {keys: return}
  - mouseDown: {id: timelineSectionStrip, x: 101, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 186, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 186, y: 12}
  - wait: {}
  - key: {keys: return}
  - mouseDown: {id: timelineSectionStrip, x: 197, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 378, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 378, y: 12}
  - wait: {}
  - key: {keys: return}
  - mouseDown: {id: timelineSectionStrip, x: 389, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 474, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 474, y: 12}
  - wait: {}
  - key: {keys: return}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 1:0.000:4.000:1/1;Section 2:4.000:4.000:1/1;Section 3:8.000:8.000:1/1;Section 4:16.000:4.000:1/1", within_ms: 2000}
  - screenshot: {name: 1-four-sections}
  # Check 1: click Section 1, Cmd-click Section 3: both are selected.
  - click: {id: timelineSectionStrip, x: 40, y: 12}
  - click: {id: timelineSectionStrip, x: 280, y: 12, mods: cmd}
  - expect: {id: timelineSections, selectedSections: "0.000;8.000", within_ms: 2000}
  # Drag Section 1 (grabbed 40 px in) one bar right, past Section 4: Section 4 closes up to the start and the group
  # lands after it with Section 2 still between its members, filmed step by step.
  - drag: {from: timelineSectionStrip, to: timelineSectionStrip, fromX: 40, fromY: 12, toX: 136, toY: 12, steps: 20}
  - mark: {check: 1, name: group-drag-moves-both}
  - expect: {id: timelineSections, sections: "Section 4:0.000:4.000:1/1;Section 1:4.000:4.000:1/1;Section 2:8.000:4.000:1/1;Section 3:12.000:8.000:1/1", within_ms: 2000}
  - expect: {id: timelineSections, selectedSections: "4.000;12.000", within_ms: 2000}
  - mark: {check: 4, name: group-drag-keeps-gap}
  # Check 2: Delete removes both selected blocks and their bars in one step; one Cmd+Z brings both back.
  - key: {keys: backspace}
  - expect: {id: timelineSections, sections: "Section 4:0.000:4.000:1/1;Section 2:4.000:4.000:1/1", within_ms: 2000}
  - key: {keys: cmd+z}
  - mark: {check: 2, name: delete-then-undo-both}
  - expect: {id: timelineSections, sections: "Section 4:0.000:4.000:1/1;Section 1:4.000:4.000:1/1;Section 2:8.000:4.000:1/1;Section 3:12.000:8.000:1/1", within_ms: 2000}
  # Check 3: click Section 4, Shift-click Section 3: the run from 4 to 3 (Sections 1 and 2 between) is selected. Cmd+D
  # places copies of all three after the last one, with the same spacing; undo takes them away. Then an Option-drag of
  # the run to the end places the same copies, filmed step by step.
  - click: {id: timelineSectionStrip, x: 40, y: 12}
  - click: {id: timelineSectionStrip, x: 380, y: 12, mods: shift}
  - expect: {id: timelineSections, selectedSections: "0.000;4.000;8.000;12.000", within_ms: 2000}
  - key: {keys: cmd+d}
  - expect: {id: timelineSections, contains: {sections: "Section 3:12.000:8.000:1/2;Section 4:20.000:4.000:2/2;Section 1:24.000:4.000:2/2;Section 2:28.000:4.000:2/2;Section 3:32.000:8.000:2/2"}, within_ms: 2000}
  - key: {keys: cmd+z}
  - expect: {id: timelineSections, sections: "Section 4:0.000:4.000:1/1;Section 1:4.000:4.000:1/1;Section 2:8.000:4.000:1/1;Section 3:12.000:8.000:1/1", within_ms: 2000}
  - click: {id: timelineSectionStrip, x: 40, y: 12}
  - click: {id: timelineSectionStrip, x: 380, y: 12, mods: shift}
  - expect: {id: timelineSections, selectedSections: "0.000;4.000;8.000;12.000", within_ms: 2000}
  - drag: {from: timelineSectionStrip, to: timelineSectionStrip, fromX: 40, fromY: 12, toX: 520, toY: 12, steps: 18, mods: alt}
  - mark: {check: 3, name: shift-range-then-copy}
  - expect: {id: timelineSections, contains: {sections: "Section 3:12.000:8.000:1/2;Section 4:20.000:4.000:2/2;Section 1:24.000:4.000:2/2;Section 2:28.000:4.000:2/2;Section 3:32.000:8.000:2/2"}, within_ms: 2000}
