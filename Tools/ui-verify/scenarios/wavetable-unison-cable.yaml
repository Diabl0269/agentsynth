# The Wavetable's Unison knob takes a modulation cable: the card lists it, the knob keeps its own value, and the cable
# sets the voice count at each note start.
#
# What a user does: adds a Wavetable and an LFO from the library (Cmd+F), drags the LFO output onto Unison, plays a few
# notes on the computer keyboard, and sees the cable on the card. The voice count itself is covered by
# WavetableUnisonCable (offline render).
# Needs the app to be the active application (the library search field must have keyboard focus).
record: true
save_project: fro1556 wavetable unison cable
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "wavetable"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "lfo"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - click: {id: Hide Panel}
  - wait: {}
  - click: {id: "card:Wavetable > cardTabStrip", x: 10}   # the Tune tab, already shown: focuses the strip
  - key: {keys: right}                                      # the Unison tab
  - wait: {}
  - mouseDown: {id: "card:LFO", x: 268, y: 56}
  - mouseMoveHeld: {id: "card:Wavetable > Unison"}
  - mouseMoveHeld: {id: "card:Wavetable > Unison"}
  - glide: {name: cable-drop, frames: 14, do: {mouseUp: {id: "card:Wavetable > Unison"}}}
  - wait: {settleMs: 600}
  - expect: {id: "card:Wavetable", contains: {cabledTargets: Unison}, within_ms: 3000}
  - mark: {check: 1, name: unison-cable}
