# Audit of the panel-slide anchoring fix (Add Track and the song key wait for the Timeline's slide): Cmd+3 (Show Controllers Tab)
# lands where it should once the panel has slid in, not where the panel was when the key was pressed.
#
# What a user does: with the bottom panel closed, presses Cmd+3. The panel slides open (hence `motion: true`) and keyboard focus lands on the panel's tab strip, level with the tab.
# The PNG is taken after the slide landed.
motion: true
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - key: {keys: cmd+3}
  - expect: {id: Controllers, bounds: {x: 1066, y: 661, w: 534, h: 19}, within_ms: 1500}
  - expect: {id: Panel tabs, hasFocus: true}
  - screenshot: {name: cmd-3-closed-window}
