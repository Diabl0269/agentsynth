# Hovering a knob lists every modulation on it: two LFOs routed to the Filter's Cutoff (+50% and -25%) give one chip row
# each under the knob, and dragging the dot shows the dragged source's live amount in that stack, not above-right.
#
# What a user does:
#   1. Opens a project with two LFOs modulating the Filter's Cutoff.
#   2. Rests the pointer on the Cutoff knob: a row for each LFO shows under it.
#   3. Presses the dot and drags up: the first source's row shows its live amount, the other row stays.
motion: true
record: true
save_project: mod-chip-lists-every-source
steps:
  - openProject: {path: "${FIXTURES}/mod-dot-two-lfos.agsproj"}
  - wait: {}
  - hover: {id: Cutoff}
  - expect: {id: "card:Filter", modHoverChip: true, within_ms: 3000}
  - expect: {id: "card:Filter", contains: {modHoverChipRows: "+50%"}}
  - expect: {id: "card:Filter", contains: {modHoverChipRows: "-25%"}}
  - screenshot: {id: "card:Filter", name: chip-stack-on-hover}
  - mouseDown: {id: "Cutoff modulation, 2 sources"}
  - mouseMoveHeld: {id: "Cutoff modulation, 2 sources", x: 3, y: -20}
  - expect: {id: "card:Filter", modHoverChip: true,}
  - expect: {id: "card:Filter", contains: {modHoverChipRows: "-25%"}}
  - screenshot: {id: "card:Filter", name: chip-stack-while-dragging}
  - mouseUp: {id: "Cutoff modulation, 2 sources", x: 3, y: -20}
