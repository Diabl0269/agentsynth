# Feature: a "Sync" caption button replaces the Free/Sync switch (LFO, ADSR, Delay), and the LFO, ADSR (Amp Env, Filter
# Env), VCA, Envelope Follower, Sample & Hold, Math, Voice Mixer and Poly MIDI cards lay their controls out in lanes:
# the Out lane (Level) last at the bottom right where the module has one. Lit Sync means synced and the readout shows
# the note value; toggling it leaves no empty gap on the card.
#
# What a user does:
#   1. Starts an empty project, opens the library (Cmd+F) and adds a Delay, a VCA, an Envelope Follower, a Sample & Hold,
#      a Math, a Voice Mixer, a Poly MIDI, an ADSR and an LFO (the LFO goes last, so it is the card in view).
#   2. Clicks the LFO's Sync button off and on again: the card keeps its size, no gap opens (check 1). Clicks the Delay's
#      Sync button: its Time reads a note value (check 1).
#   3. Selects the ADSR: its fader readouts read "12 ms" style with the space before the unit (check 2).
#   4. Selects a lane card, presses Return and Tabs: the ring walks the cells column by column (check 3).
#   5. Opens Settings > Appearance and picks each theme in turn (check 4).
# Needs the app to be the active application (the library search field must have keyboard focus).
record: true
save_project: fro2162 sync lanes
settings:
  themeId: obsidian
  themeMode: Dark
