# Muting the OSCILLATOR that feeds a Filter (FRO1986): the Filter's Show Spectrum trace only sinks to the floor, it never
# feathers or rises first (the signal cut off inside the analysis window reads as silence).
#
# What a user does:
#   1. Starts a new project, adds an Oscillator and a Filter, cables Osc -> Filter, sets the Filter to Custom, turns Show
#      Response and Show Spectrum on, plays a note (`audioPump`): the trace rises.
#   2. Presses Mute on the Oscillator card: the trace sinks to the floor (`filterSpectrumAtFloor`), see the strip.
# Proof mark: 1 osc-mute-sinks.
record: true
save_project: filter-spectrum-oscillator-mute
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: oscill}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: filter}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {count: {prefix: "card:Filter", equals: 1}, within_ms: 1500}
  - expect: {count: {prefix: "card:Oscillator", equals: 1}, within_ms: 1500}
  - click: {id: Hide Panel}
  - wait: {}
  - click: {id: Hide Minimap}
  - wait: {}
  - click: {id: Auto Arrange}
  - wait: {}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - wait: {}
  - drag: {from: "card:Oscillator > Audio output", to: "card:Filter > Audio input"}
  - wait: {}
  - click: {id: window, x: 560, y: 537}                        # the Filter Type combo (its label shares the title)
  - wait: {settleMs: 600}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {id: Edit shapes, exists: true, within_ms: 3000}
  - drag: {from: Patch canvas, to: Patch canvas, fromX: 1100, fromY: 750, toX: 1100, toY: 480}   # pan the card's foot into view
  - wait: {}
  - screenshot: {id: window, name: custom}
  - wait: {settleMs: 600}
  - click: {id: Show Spectrum}
  - wait: {settleMs: 600}
  - expect: {id: Show Spectrum, toggleState: true, within_ms: 3000}
  - drag: {from: Patch canvas, to: Patch canvas, fromX: 1100, fromY: 480, toX: 1100, toY: 780}   # pan back down: the Oscillator's Mute and the Filter's trace are both in view
  - wait: {}
  - audioPump: {run: true}
  - audioPump: {note: 69, down: true}
  - expect: {id: "card:Filter", filterSpectrumAtFloor: false, within_ms: 4000}
  - wait: {settleMs: 600}
  - glide: {name: osc-mute, frames: 16, crop: {x: 488, y: 795, w: 144, h: 80}, do: {click: {id: "card:Oscillator > Mute"}}}
  - expect: {id: "card:Filter", filterSpectrumAtFloor: true, within_ms: 3000}
  - mark: {check: 1, name: osc-mute-sinks}
  - audioPump: {note: 69, down: false}
  - audioPump: {run: false}
