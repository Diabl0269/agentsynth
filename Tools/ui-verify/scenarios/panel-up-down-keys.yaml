# Gap: the AI panel, the Mod Matrix and the MIDI Remote panel had no Up/Down stepping, so most of their controls could
# not be reached from the keyboard at all.
#
# What a keyboard user does:
#   1. Shows the AI panel and Tabs to it. Down walks New Chat, History, Sign in, Upgrade to Pro, the message box and
#      Send in reading order, each with the focus ring; Escape goes back to the panel itself. One clip (before_s) shows
#      the whole walk and the Escape; the expects between the stops check each one.
#   2. Shows the Mod Matrix and Tabs to it (canvas first). Down enters at Add modulation, Right steps to Flat sources.
#   3. Opens the Controllers tab with Cmd+3 and Tabs to the MIDI Remote panel. Down walks Add controller and More;
#      Escape goes back to the panel.
record: true
save_project: panel-up-down-keys
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - click: {id: toggleAiPanel}
  - wait: {}
  - key: {keys: tab}
  - key: {keys: tab}
  - key: {keys: tab}
  - key: {keys: tab}
  - key: {keys: tab}
  - wait: {}
  - expect: {id: AI assistant, hasFocus: true}
  - key: {keys: down}
  - wait: {}
  - expect: {id: aiNewChatButton, hasFocus: true}
  - key: {keys: down}
  - wait: {}
  - expect: {id: aiHistoryButton, hasFocus: true}
  - key: {keys: down}
  - wait: {}
  - key: {keys: down}
  - wait: {}
  - key: {keys: down}
  - wait: {}
  - expect: {id: Message to the AI assistant, hasFocus: true}
  - key: {keys: down}
  - wait: {}
  - expect: {id: aiSendButton, hasFocus: true}
  - key: {keys: escape}
  - wait: {}
  - expect: {id: AI assistant, hasFocus: true}
  - mark: {check: 1, name: ai-down-walk, before_s: 12}  # 14 frames of 0.8 s (6 Downs, Escape) plus the panel-focused frame before the first Down; the panel is opened earlier
  - click: {id: toggleAiPanel}
  - wait: {}
  - click: {id: toggleModMatrix}
  - wait: {}
  - key: {keys: tab}
  - key: {keys: tab}
  - wait: {}
  - expect: {id: modMatrix, hasFocus: true}
  - key: {keys: down}
  - wait: {}
  - expect: {id: addModulation, hasFocus: true}
  - mark: {check: 2, name: matrix-add-modulation}
  - key: {keys: right}
  - wait: {}
  - expect: {id: flatSources, hasFocus: true}
  - mark: {check: 3, name: matrix-flat-sources}
  - key: {keys: left}
  - wait: {}
  - expect: {id: addModulation, hasFocus: true}
  - click: {id: toggleModMatrix}
  - wait: {}
  - key: {keys: cmd+3}
  - wait: {}
  - expect: {id: Panel tabs, hasFocus: true}
  - key: {keys: tab}
  - wait: {}
  - key: {keys: down}
  - wait: {}
  - expect: {id: addControllerButton, hasFocus: true}
  - mark: {check: 4, name: midi-add-controller}
  - key: {keys: down}
  - wait: {}
  - expect: {id: moreButton, hasFocus: true}
  - mark: {check: 5, name: midi-more}
  - key: {keys: escape}
  - wait: {}
  - mark: {check: 6, name: midi-escape-to-panel}
