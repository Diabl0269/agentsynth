# A Key field opened its picker only once: ComboBox's "menu active" latch was never lowered, so every later click was
# ignored as "already open" (the keyboard path skipped the latch, so Space and Return kept working).
#
# What a user does: with the timeline open, clicks the transport bar's Key field (the picker opens), closes the picker
# with Escape, clicks the field again (the picker opens again), closes it, and clicks a third time.
# Not driven here: the piano roll's scale Key and a sequencer card's Key, since no committed fixture has a clip or a
# sequencer; KeyFieldTest.EveryKeyFieldOpensItsPickerOnASecondClick clicks all five owners twice.
motion: true
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - key: {keys: cmd+t}
  - expect: {id: modMatrixPicker, showing: true, within_ms: 4000}
  - key: {keys: escape}
  - expect: {id: modMatrixPicker, exists: false, within_ms: 2000}
  - expect: {id: timelineTransportSongKey, showing: true, within_ms: 2000}
  - expect: {id: keyPicker, exists: false}
  - click: {id: timelineTransportSongKey}
  - expect: {id: keyPicker, showing: true, within_ms: 2000}
  - screenshot: {name: song-key-first-open}
  - key: {keys: escape}
  - expect: {id: keyPicker, exists: false, within_ms: 2000}
  - click: {id: timelineTransportSongKey}
  - expect: {id: keyPicker, showing: true, within_ms: 2000}
  - screenshot: {name: song-key-second-open}
  - key: {keys: escape}
  - expect: {id: keyPicker, exists: false, within_ms: 2000}
  - click: {id: timelineTransportSongKey}
  - expect: {id: keyPicker, showing: true, within_ms: 2000}
