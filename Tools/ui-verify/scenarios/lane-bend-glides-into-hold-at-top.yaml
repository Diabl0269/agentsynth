# Dragging a lane segment's bend toward its start value stood still for 24-64 px (the curve pinned at its steepest) and
# then flipped to a Hold in one go; and a segment starting at the lane's TOP value could not reach the Hold at all,
# because its hold zone sat above the lane.
#
# What a user does: opens a project whose Cutoff lane falls from the top value at bar 2 to a low dot at bar 6 (fixture
# lane-top-falling.agsproj, the lane made taller), presses the middle of the line and drags up slowly: the curve bulges
# toward the top, then keeps flattening onto the top value pixel by pixel, and turns into the step ("Hold") with the
# pointer still inside the lane. Lets go: one undo step; Cmd+Z puts back the straight line.
record: true
motion: true
pop_check: {undo: false}   # undo off: the scenario's own undo is what it checks
save_project: "FRO2019 test"
steps:
  - openProject: {path: "${FIXTURES}/lane-top-falling.agsproj"}
  - wait: {}
  - click: {id: toggleBottomPanel}
  - wait: {}
  # a taller dock and lane, so the bend is plain to see in the clip
  - mouseDown: {id: dockResizeHandle, y: 2}
  - mouseMoveHeld: {id: dockResizeHandle, y: -330}
  - mouseUp: {id: dockResizeHandle, y: 2}   # the handle has moved with the pointer
  - wait: {}
  - mouseDown: {id: laneHeightHandle, y: 2}
  - mouseMoveHeld: {id: laneHeightHandle, y: 182}
  - mouseUp: {id: laneHeightHandle, y: 2}   # the handle has moved with the pointer
  - wait: {}
  - click: {id: timelineToolSelect, instant: "the lane height handle's hover line clears as the pointer leaves it"}
  - expect: {id: automationLaneState, points: 2, firstBend: straight}
  # press the middle of the line and pull up to the steepest curve
  - mouseDown: {id: automationLaneEditor, x: 288, y: 66}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 40, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 22, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 17, captured: true}
  - expect: {id: automationLaneState, dragging: true, bendShape: curve}
  # on up, a few pixels at a time: the curve flattens onto the top value with every move, no stand-still, no flip
  - glide: {name: flattens, frames: 4, crop: {x: 290, y: 440, w: 500, h: 200}, do: {mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 11, captured: true}}}
  - expect: {id: automationLaneState, dragging: true, bendShape: flattening, bendHold: false}
  - glide: {name: flattens-more, frames: 4, crop: {x: 290, y: 440, w: 500, h: 200}, do: {mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 7, captured: true}}}
  - expect: {id: automationLaneState, dragging: true, bendShape: flattening, bendHold: false}
  - mark: {check: 1, name: flattens-with-the-pointer}
  # the last pixels, still inside the lane: the step, with the "Hold" bubble
  - glide: {name: glides-into-hold, frames: 4, crop: {x: 290, y: 440, w: 500, h: 200}, do: {mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 1, captured: true}}}
  - expect: {id: automationLaneState, dragging: true, bendShape: hold, bendHold: true}
  - mark: {check: 2, name: hold-inside-the-lane-at-the-top}
  - mouseUp: {id: automationLaneEditor, x: 288, y: 1}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: step, holdSegments: 1, dragging: false}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: straight, holdSegments: 0}
