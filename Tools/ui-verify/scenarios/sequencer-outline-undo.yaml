# FRO1544: the outline of the note you wrote stays on screen while Cmd+Z and Cmd+Shift+Z glide the bars; it fades and
# moves with them and never vanishes then returns.
#
# What a user does: adds a Sequencer, writes E2 on step 1, picks C Natural Minor in the card's Key picker (E plays as
# D#2 and step 1 shows the outline at E), then presses Cmd+Z (the key goes back) and Cmd+Shift+Z (it comes again).
motion: true
record: true
save_project: sequencer-outline-undo
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f, instant: "focus ring and caret appear on the library search field"}
  - wait: {}
  - key: {keys: cmd+a, instant: "the text selection highlight appears in the library search field"}
  - type: {text: sequencer}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {id: sequencerKey, showing: true, within_ms: 2000}
  - click: {id: Hide Panel}
  - wait: {}
  - click: {id: stepGrid, x: 20, y: 120, instant: "the focus ring moves to the canvas panel"}
  - key: {keys: down, instant: "the selected step cell moves"}
  - wait: {}
  - click: {id: sequencerKey}
  - expect: {id: keyPicker, showing: true, within_ms: 2000}
  - click: {id: "C Natural Minor, C D D# F G G# A#"}
  - expect: {id: keyPicker, exists: false, within_ms: 2000}
  - expect: {id: stepGrid, playedNotes: "D#2,F3,F2,C3,F2,G#2,F2,C3", outlinedSteps: "1,3,4,6,7", within_ms: 1500}
  - wait: {settleMs: 800}
  - screenshot: {name: 1-natural-minor}
  - key: {keys: cmd+z}
  - mark: {check: 1, name: undo-outline-fades}
  - wait: {settleMs: 600}
  - screenshot: {name: 2-after-undo}
  - key: {keys: cmd+shift+z}
  - mark: {check: 1, name: redo-outline-returns}
  - wait: {settleMs: 600}
  - expect: {id: stepGrid, outlinedSteps: "1,3,4,6,7", within_ms: 1500}
  - screenshot: {name: 3-after-redo}
