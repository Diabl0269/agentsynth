# Bug (downsample-skip): a recorded clip drew one bucket per pixel column, skipping the buckets between, so a swept tone
# looked like stepped rectangles. Each column now folds every bucket it covers, so the envelope is smooth and every loud
# part shows at its height.
#
# What a user does: opens a project with one 4 s audio clip, a sine sweeping 110 Hz to 2 kHz in four decaying notes,
# and looks at its waveform. The probe `clipWaveform` reads `name:none|summary|columns`; the PNG shows the envelope.
# Opening an old project backfills the missing waveform file, so no peaks file ships with the fixture.
record: true
save_project: waveform-sweep-envelope
steps:
  - copyFixture: {name: waveform-sweep.agsproj}
  - openProject: {path: "${SCRATCH}/waveform-sweep.agsproj"}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - click: {id: Show Timeline in the main area}
  - wait: {}
  - expect: {id: timelineClipPitches, clipWaveform: "Sweep:columns", within_ms: 10000}
  - screenshot: {id: timelineClipLaneArea, name: sweep-envelope}
