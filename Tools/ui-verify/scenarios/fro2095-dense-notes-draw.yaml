# Feature: a shape's curve holds up to 256 points, so a dense stroke in the Filter's Edit shapes window is kept whole
# instead of being thinned to 64. The Free pen follows a zigzag of many mouse moves; the committed curve has more than
# 64 points and the zigzag reaches the right edge of the curve.
#
# What a user does: sets a Filter to Custom, opens Edit shapes, clicks Draw and picks Free, then drags a fast zigzag
# across the full width of the curve and releases.
# Proof mark: 1 dense-notes-draw (many peaks to the right edge, after the release).
record: true
save_project: fro2095 dense notes
steps:
  - openProject: {path: "${FIXTURES}/mod-dot.agsproj"}
  - wait: {settleMs: 600}
  - click: {id: window, x: 1019, y: 411}                       # the Filter Type combo
