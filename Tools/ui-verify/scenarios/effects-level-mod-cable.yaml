# The Level control of every effect (and the Filter) takes a modulation cable, and so do a card's Pan and shared Mix.
#
# What a user does: adds an effect and an LFO from the library (Cmd+F), drags the LFO output onto the effect's Level
# (Pan and Mix sit in the card's More row), and the card lists the cable. The app restarts between effects so each card has the canvas to itself.
# Needs the app to be the active application (the library search field must have keyboard focus).
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "reverb"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "lfo"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - click: {id: Hide Panel}
  - wait: {}
  - drag: {from: "card:LFO", fromX: 268, fromY: 56, to: "card:Reverb > Level"}
  - wait: {}
  - expect: {id: "card:Reverb", contains: {cabledTargets: Level}, within_ms: 3000}
  - screenshot: {id: "card:Reverb", name: "Reverb-Level"}
  - restart: {}
