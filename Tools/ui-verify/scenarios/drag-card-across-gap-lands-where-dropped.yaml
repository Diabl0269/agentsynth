# Bug (FRO1443): a card dragged out of the open "Oscillator 1" macro and released just under its border, anywhere
# along it, always landed far to the left, in front of the loose Reverb 2 at the start of the row below. The insert gap
# took the wide border as the card the pointer touched and the next unit in its column (Reverb 2) as the anchor, and a
# card lands level with its anchor. It looked like the card snagged on something invisible. Now an anchor the aimed card does
# not overlap across the axis is no gap, so the drop is an ordinary one and the card stays where it was released.
#
# What a user does (a copy of Tal's 'fro1153' project):
#   1. Zooms out so the whole macro row and the gap under it show.
#   2. Drags Reverb 1 out of "Oscillator 1" to just under the border, then across the gap to three more points.
#   3. After every drop the card is where it was released (nudged straight down, just clear of the border), and
#      Reverb 2 never moves.
#   4. Drags Track In 1 out of the macro, then drops it just over the macro's middle and right, where there is no room
#      above it: it lands straight below the macro at the x it was dropped at. Before, the gap in front of the macro put
#      it at the macro's left edge, and the free-spot search then took a corner far right of the drop.
# InsertGapPlan.AnAnchorNotAcrossFromTheAimIsNoGap, InsertGapPlan.AnOpenMacroIsNoGapWhereItsLeadEdgeIsNotAcrossFromTheAim,
# LayoutUtilTest.FindFreeSlotPicksTheNearestSpotOfItsRing and
# LayoutUnitFootprint.EveryInsertGapOfASavedProjectLandsTheCardWhereItIsAimed cover the geometry headlessly.
