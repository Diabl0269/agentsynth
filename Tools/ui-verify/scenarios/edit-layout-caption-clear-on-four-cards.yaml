# In Edit Layout the outline round each control keeps clear room (4 px) round its caption's letters on all four sides:
# the Filter Type title and every other caption of the Filter, Oscillator, Delay and Compressor cards no longer sit
# against the outline's stroke.
#
# What a user does: opens a project with those four cards, right-clicks a card's title, picks Edit Layout..., looks
# at the outlined captions, presses Escape to leave, and does the same on the next card.
record: true
save_project: FRO2144 caption clear
steps:
  - copyFixture: {name: "fro2144-four-cards.agsproj"}
  - openProject: {path: "${SCRATCH}/fro2144-four-cards.agsproj"}
  - wait: {}
  - click: {id: "card:Filter", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - screenshot: {name: filter-edit-layout}
  - mark: {check: 1, name: filter-captions-clear}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - click: {id: "card:Oscillator", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - screenshot: {name: oscillator-edit-layout}
  - mark: {check: 2, name: oscillator-captions-clear}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - click: {id: "card:Delay", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - screenshot: {name: delay-edit-layout}
  - mark: {check: 3, name: delay-captions-clear}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - click: {id: "card:Compressor", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - screenshot: {name: compressor-edit-layout}
  - mark: {check: 4, name: compressor-captions-clear}
  - key: {keys: escape}
  - wait: {settleMs: 600}
