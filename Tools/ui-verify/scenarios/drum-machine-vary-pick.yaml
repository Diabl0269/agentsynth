# Vary > Pick replaces the open clip's pattern: the grid you are on shows the take, no clip is added, the clip keeps
# playing, and one Cmd+Z brings the old pattern back.
#
# What a user does:
#   1. Opens the project with a Drum Kit track and an empty "Beat 1" clip, opens the drum machine and picks the House
#      starter from Ideas.
#   2. Presses Play clip: it reads "Stop clip" while the clip loops.
#   3. Opens Ideas, presses Make 3 takes and Pick under the second take.
#   4. The grid shows another pattern, the track still has one clip, Play clip still reads "Stop clip".
#   5. Cmd+Z puts the House pattern back in one step.
# Test mode has no audio device, so the song transport never starts there; "playing" is the clip loop (Play clip).
record: true
save_project: vary-pick
steps:
  - openProject: {path: "${FIXTURES}/drum-kit-track-clip.agsproj"}
  - wait: {}
  - key: {keys: cmd+t}
  - wait: {}
  - click: {id: trackDrumMachineButton}
  - wait: {}
  - click: {id: drumIdeas}
  - wait: {}
  - click: {id: House}
  - wait: {}
  - key: {keys: escape}
  - wait: {}
  - getState: {id: drumMachineState}
  - screenshot: {name: 1-house-starter}
  - click: {id: drumPlayClip}
  - wait: {}
  - expect: {id: drumPlayClip, contains: {text: Stop clip}, within_ms: 1500}
  - getState: {id: timelineClipPitches}
  - click: {id: drumIdeas}
  - wait: {}
  - click: {id: Make 3 takes}
  - wait: {}
  - screenshot: {name: 2-three-takes}
  - click: {id: Pick take 2}
  - wait: {}
  - getState: {id: drumMachineState}
  - expect: {id: timelineClipPitches, clipLengths: "Beat 1:4.000"}
  - expect: {id: drumPlayClip, contains: {text: Stop clip}}
  - screenshot: {name: 3-after-pick}
  - key: {keys: escape}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: drumMachineState, hits: "36:0,4,8,12;39:4,12;42:0,2,6,8,10,14;46:2,6,10,14", within_ms: 1500}
  - expect: {id: timelineClipPitches, clipLengths: "Beat 1:4.000"}
  - expect: {id: drumPlayClip, contains: {text: Stop clip}}
  - screenshot: {name: 4-after-undo}
