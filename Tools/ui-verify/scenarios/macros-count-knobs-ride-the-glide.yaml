# The Macros card's Controllers count adds or drops a row of knobs: the card's height glides (160 ms), and the knobs come
# and go IN STEP with it, part-grown in the same frames where the card is part-way, not waiting for it and not after it.
# Before the fix the card grew first and the new row's knobs only appeared (190 ms later) once it had landed. Four
# controllers is one row; five adds a second one. Each `glide` films the change frame by frame (each recorded frame moves
# a 16 ms animation step on), and each mark sits on the landed state. MacroCountKnobsRideTheGlide.* and
# PartsMoveWithContainer.* cover the timing headlessly.
motion: true
pop_check: {undo: false}
record: true
save_project: fro1859 macros controllers
steps:
  - openProject: {path: "${FIXTURES}/macros-bank-cabled.agsproj"}
  - wait: {}
  - wheel: {id: window, x: 800, y: 450, dx: -6.2, dy: 2.7}
  - wait: {}
  - click: {id: Controllers}
  # Eight down to four: one row of knobs, the state the checks start from.
  - key: {keys: down, target: Controllers}
  - key: {keys: down, target: Controllers}
  - key: {keys: down, target: Controllers}
  - key: {keys: down, target: Controllers}
  - wait: {settleMs: 600}
  - screenshot: {name: 1-bank-one-row}
  - glide: {name: count-up-adds-a-row, frames: 14, crop: {x: 200, y: 150, w: 640, h: 330}, do: {key: {keys: up, target: Controllers}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 2-bank-two-rows}
  - mark: {check: 1, name: knobs-grow-with-the-card}
  - glide: {name: undo-drops-the-row, frames: 14, crop: {x: 200, y: 150, w: 640, h: 330}, do: {key: {keys: cmd+z}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 3-after-undo}
  - mark: {check: 2, name: undo-knobs-leave-with-the-card}
  - glide: {name: redo-adds-the-row, frames: 14, crop: {x: 200, y: 150, w: 640, h: 330}, do: {key: {keys: cmd+shift+z}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 4-after-redo}
  - mark: {check: 3, name: redo-knobs-grow-with-the-card}
  - glide: {name: count-down-drops-the-row, frames: 14, crop: {x: 200, y: 150, w: 640, h: 330}, do: {key: {keys: down, target: Controllers}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 5-bank-one-row-again}
  - mark: {check: 4, name: knobs-shrink-with-the-card}
