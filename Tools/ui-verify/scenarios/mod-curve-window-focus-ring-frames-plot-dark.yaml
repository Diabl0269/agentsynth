# The Mod curve Enlarge window's curve editor: when it has the keyboard, its focus ring frames the whole plot with a small gap and the curve, grid and
# fill stay inside it (dark theme).
#
# What a user does: opens it, then puts the keys on it (Right picks a point, or the strip takes the keys). A rounded ring
# stands round the plot; nothing of the plot runs under or past it.
# Proof marks: check 1, the plot with its ring.
record: true
save_project: mod curve window focus ring frames plot dark
settings:
  themeId: obsidian
  themeMode: Dark
steps:
  - openProject: {path: "${FIXTURES}/mod-dot.agsproj"}
  - wait: {}
  - click: {id: toggleModMatrix}
  - wait: {}
  - click: {id: modCurve}
  - wait: {}
  - click: {id: "Enlarge curve editor"}
  - wait: {}
  - expect: {id: modCurveWindow, showing: true, within_ms: 2000}
  - key: {keys: right, target: modCurveWindowEditor, instant: "a point of the curve is picked and the ring shows"}
  - wait: {settleMs: 400}
  - expect: {id: modCurveWindowEditor, hasFocus: true}
  - screenshot: {id: modCurveWindowEditor, name: mod-curve-window-ring}
  - mark: {check: 1, name: mod-curve-window-ring-frames-plot}
