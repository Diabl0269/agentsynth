# The Level knob of Drum Kit, Pluck and Mallet takes a modulation cable; the Wavetable's Unison refuses one out loud.
#
# What a user does: adds an instrument and an LFO from the library (Cmd+F), drags the LFO output onto the
# instrument's Level, and the card lists the cable. Then adds a Wavetable and an LFO and drops the LFO output on
# Unison: nothing connects and the status bar says "Unison takes no mod cable: it sets a whole number of voices".
# The app restarts between modules so each card has the canvas to itself. The sound of a modulated Level is covered
# by InstrumentLevelModCableTests (offline render).
# Needs the app to be the active application (the library search field must have keyboard focus).
record: true
save_project: instrument-level-mod-cable
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "pluck"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "lfo"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - click: {id: Hide Panel}
  - wait: {}
  - drag: {from: "card:LFO", fromX: 268, fromY: 56, to: "card:Pluck > Level"}
  - wait: {}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Level}, within_ms: 3000}
  - screenshot: {id: "card:Pluck", name: "Pluck-Level"}
  - restart: {}
