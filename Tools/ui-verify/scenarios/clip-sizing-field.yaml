# The timeline's clip sizing control is a toolbar button like its neighbours: an icon per mode (trim, carry, stretch)
# and the mode's short name beside it, one fixed width in every mode so the strip never shifts. It is never lit: the
# icon and caption are the state.
#
# What a user does: opens the timeline with Select as the tool, clicks a lane, then presses 1 twice (Trim -> Carry
# contents -> Stretch to fit). After every press the control keeps its width. The proof still is the control at
# Stretch with the labels shown; clip-sizing-field-icon-only runs the same with Show button labels off.
record: true
save_project: clip-sizing-field
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - key: {keys: cmd+t}
  - expect: {id: modMatrixPicker, showing: true, within_ms: 4000}
  - key: {keys: escape}
  - wait: {}
  - expect: {id: timelineToolSelect, toggleState: true}
  - expect: {id: timelineClipSizingState, sizingMode: trim, glyph: trim, caption: Trim}
  - expect: {id: timelineClipSizing, title: "Clip sizing", contains: {tooltip: "(1)"}}
  - click: {id: window, x: 800, y: 800}
  - wait: {settleMs: 600}
  - key: {keys: "1"}
  - expect: {id: timelineClipSizingState, sizingMode: carry, glyph: carry, caption: Carry}
  - wait: {settleMs: 600}
  - key: {keys: "1"}
  - expect: {id: timelineClipSizingState, sizingMode: stretch, glyph: stretch, caption: Stretch}
  - mark: {check: 1, name: sizing-stretch}
  - wait: {settleMs: 1000}
  - screenshot: {id: timelineClipSizing, name: stretch-button}
  # The menu still picks a mode: Stretch is ticked; Down once and Return picks Trim.
  - click: {id: timelineClipSizing}
  - wait: {settleMs: 500}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {id: timelineClipSizingState, sizingMode: trim, glyph: trim, within_ms: 2000}
