# Feature: a Filter already in By pitch gets its Pitch cable the moment a cable gives it a pitch source, in the same
# undo step as that cable; nothing adds it when a project loads.
#
# What a user does: adds Oscillator, Filter and Poly MIDI, cables Osc -> Filter, sets the Filter to Custom and picks By
# pitch (no pitch source yet, so no cable), then drags Poly Out onto the Oscillator's Pitch input: the Filter's Pitch
# input is cabled at once. Cmd+Z takes the Poly cable and the Pitch cable away together.
record: true
save_project: filter-pitch-auto-cable
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: oscill}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: filter}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: poly}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {count: {prefix: "card:Poly MIDI", equals: 1}, within_ms: 1500}
  - expect: {count: {prefix: "card:Filter", equals: 1}, within_ms: 1500}
  - expect: {count: {prefix: "card:Oscillator", equals: 1}, within_ms: 1500}
  - click: {id: Auto Arrange}
  - wait: {}
  - key: {keys: cmd+-}                                       # zoom out (5x) so both cards fit above the bottom panel
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - wait: {}
  - drag: {from: Patch canvas, to: Patch canvas, fromX: 1200, fromY: 300, toX: 1200, toY: 270}   # pan up so the Poly MIDI card clears the bottom panel
  - wait: {}
  - drag: {from: "card:Oscillator > Audio output", to: "card:Filter > Audio input"}
  - wait: {}

  - click: {id: window, x: 676, y: 413}                      # the Filter Type combo at this zoom (its label has the same title)
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {id: Edit shapes, exists: true, within_ms: 3000}  # the Custom layout has settled
  - wait: {}
  - wait: {}
  - click: {id: Edit shapes}
  - wait: {}
  - expect: {id: Notes move the cursor, exists: true, within_ms: 5000}
  - expect: {id: Notes move the cursor, contains: {tooltip: "by hand, by pitch or at random"}}
  - click: {id: By pitch}
  - wait: {}
  - expect: {id: "card:Filter", cabledInputs: Audio}
  - expect: {id: By pitch, toggleState: true, within_ms: 1500}
  - click: {id: Done}                                        # close the shape window so the cards are reachable
  - wait: {}
  - key: {keys: cmd+-}                                       # the Custom Filter card is tall: zoom out so Poly MIDI is reachable
  - key: {keys: cmd+-}
  - wait: {}
  - drag: {from: "card:Poly MIDI > Poly Out output", to: "card:Oscillator > Pitch input"}
  - mark: {check: 1, name: pitch-cable-appears-with-the-drop}
  - wait: {}
  - expect: {id: "card:Filter", contains: {cabledInputs: Pitch}, within_ms: 1500}
  - screenshot: {id: window, name: filter-pitch-auto-cable-after-drop}
  - key: {keys: cmd+z}
  - wait: {}
  - mark: {check: 2, name: one-undo-removes-both-cables}
  - expect: {id: "card:Filter", cabledInputs: Audio}   # the Filter's Pitch cable went with the Poly cable
  - expect: {id: "card:Oscillator", cabledInputs: ""}
  - screenshot: {id: window, name: filter-pitch-auto-cable-after-undo}
