# Dragging a lane segment's curve toward the TOP of the lane: the pull up must reach the steepest curve and the step
# ("Hold") only at the very top, and letting go anywhere on the way keeps exactly what was drawn: a drop in the
# hold's overshoot (the steepest curve, not yet the step) keeps the steepest curve, never springs back to the old
# straight line, and never turns into the step it did not show.
#
# What a user does: opens a project whose Cutoff lane falls from the top value at bar 2 to a low dot at bar 6 (fixture
# lane-top-falling.agsproj, the lane made taller), presses the middle of the line, pulls up to the top, and lets go at
# several heights: mid-lane (the curve as drawn), a few rows under the top (the steepest curve), at the top row (the
# step). Cmd+Z puts back what was there before each.
record: true
motion: true
pop_check: {undo: false}   # undo off: the scenario's own undo is what it checks
save_project: "FRO2171 test"
steps:
  - openProject: {path: "${FIXTURES}/lane-top-falling.agsproj"}
  - wait: {}
  - click: {id: toggleBottomPanel}
  - wait: {}
  # a taller dock and lane, so the bend is plain to see in the clip
  - mouseDown: {id: dockResizeHandle, y: 2}
  - mouseMoveHeld: {id: dockResizeHandle, y: -330}
  - mouseUp: {id: dockResizeHandle, y: 2, instant: "the dock edge settles as the panel stops growing"}   # the handle has moved with the pointer
  - wait: {}
  - mouseDown: {id: laneHeightHandle, y: 2}
  - mouseMoveHeld: {id: laneHeightHandle, y: 182}
  - mouseUp: {id: laneHeightHandle, y: 2}   # the handle has moved with the pointer
  - wait: {}
  - click: {id: timelineToolSelect, instant: "the lane height handle's hover line clears as the pointer leaves it"}
  - expect: {id: automationLaneState, points: 2, firstBend: straight}
  # 1. press the middle and pull up to a mid-lane row: the curve bulges up, and a release keeps it
  - mouseDown: {id: automationLaneEditor, x: 288, y: 66}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 56, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 46, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 36, captured: true}
  - expect: {id: automationLaneState, dragging: true, bendShape: curve, bendHold: false}
  - mouseUp: {id: automationLaneEditor, x: 288, y: 36, instant: "the drag stroke settles to the committed stroke: the curve itself does not move"}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: up, holdSegments: 0, dragging: false}
  - mark: {check: 1, name: release-mid-lane-keeps-the-curve}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: straight, holdSegments: 0}
  # 2. pull up to a few rows under the top (inside the hold's overshoot) and let go: the steepest curve stays, as drawn
  - mouseDown: {id: automationLaneEditor, x: 288, y: 66}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 50, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 34, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 22, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 14, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 10, captured: true}
  - expect: {id: automationLaneState, dragging: true, bendShape: curve, bendHold: false}
  - mark: {check: 2, name: steepest-curve-just-under-the-top}
  - mouseUp: {id: automationLaneEditor, x: 288, y: 10, instant: "the drag stroke settles to the committed stroke: the curve itself does not move"}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: up, holdSegments: 0, dragging: false}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: straight, holdSegments: 0}
  # 3. pull all the way to the top row: the step, and a release there keeps it
  - mouseDown: {id: automationLaneEditor, x: 288, y: 66}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 40, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 20, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 8, captured: true}
  - mouseMoveHeld: {id: automationLaneEditor, x: 288, y: 1, captured: true}
  - expect: {id: automationLaneState, dragging: true, bendShape: hold, bendHold: true}
  - mark: {check: 3, name: step-at-the-top-row}
  - mouseUp: {id: automationLaneEditor, x: 288, y: 1, instant: "the drag stroke settles to the committed stroke: the curve itself does not move"}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: step, holdSegments: 1, dragging: false}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: automationLaneState, firstBend: straight, holdSegments: 0}
