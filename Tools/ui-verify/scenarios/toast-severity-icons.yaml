# A toast leads with an icon for its severity: dropping an output on an output shows a red-edged toast with an error
# icon (a circled x) before the text.
#
# What a user does: adds a Delay and an LFO, drags a cable from the LFO's output and drops it on the Delay's output.
# The error toast appears with the icon before its message. Needs the app to be the active application (the library
# search field must have keyboard focus).
motion: true
record: true
save_project: "fro1574 test"
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: delay}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: lfo}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - click: {id: Hide Panel}
  - wait: {}
  - drag: {from: "card:LFO", fromX: 268, fromY: 56, to: "card:Delay", toX: 268, toY: 56}
  - expect: {id: "Error: Connect an output to an input", showing: true, within_ms: 2000}
  - wait: {}
  - expect: {id: toastState, severity: error, within_ms: 2000}
  - mark: {check: 1, name: error-toast-icon}
