# FRO2054: cards follow the Depth setting (Flat, Soft, Rich) in the daylight theme.
#
# What a user does: opens a project with module cards, a folded macro card and the Mixer, then picks Flat, Soft and Rich in
# Settings > Appearance > Controls > Depth. Module cards, the macro card and the mixer columns re-skin at each pick: Flat is
# a plain fill and border, Soft is today's look, Rich adds a rim light on the top left, a deeper inner shade, an accent seam
# under the card header and a stronger shadow. Proof marks: check 1, the same screen at each level
# (depth-cards-daylight-flat, depth-cards-daylight-soft, depth-cards-daylight-rich); close-ups of the Compressor card and the
# macro card beside them (depth-card-*, depth-macro-*).
settings:
  themeId: daylight
  themeMode: Light
steps:
  - copyFixture: {name: channel-strip-macro.agsproj}
  - openProject: {path: "${SCRATCH}/channel-strip-macro.agsproj"}
