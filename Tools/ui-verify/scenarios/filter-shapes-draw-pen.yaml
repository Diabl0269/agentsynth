# Feature: the Draw tool in the shape window draws where you drag. Pick the Sine pen, drag across part of the curve:
# only that stretch changes on release; the curve's tooltip describes the pen while it is on.
#
# What a user does: opens Edit shapes, clicks Draw, picks Sine, drags across the middle of the curve.
record: true
save_project: filter-shapes-draw-pen
steps:
  - openProject: {path: "${FIXTURES}/mod-dot.agsproj"}
  - wait: {settleMs: 600}
  - click: {id: window, x: 1019, y: 411}                       # the Filter Type combo (its label shares the title)
  - wait: {settleMs: 600}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: return, target: Edit shapes}
  - wait: {settleMs: 800}
  - expect: {id: Shape curve, exists: true, within_ms: 3000}
  - screenshot: {id: "Filter shapes: Filter", name: before-draw}
  - click: {id: Draw}
  - wait: {settleMs: 400}
  - click: {id: Sine shape}
  - wait: {settleMs: 400}
  - hover: {id: Shape curve, x: 150, y: 100}                   # the tooltip now describes the pen
  - wait: {settleMs: 1500}
  - screenshot: {id: "Filter shapes: Filter", name: pen-on}
  - drag: {from: Shape curve, to: Shape curve, fromX: 150, fromY: 100, toX: 330, toY: 100, steps: 8}
  - wait: {settleMs: 300}
  - wait: {settleMs: 400}
  - screenshot: {id: "Filter shapes: Filter", name: after-draw}
