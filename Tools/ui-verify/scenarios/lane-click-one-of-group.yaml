# A plain click on one of several selected lane points picks just that point, and a box over several points leaves the
# keyboard cursor on the point it took in last (as the EQ and curve editors do).
#
# What a user does: opens a project whose Cutoff lane has a row of points (fixture lane-box-edge.agsproj), draws a box
# over several of them (all selected, the cursor on the last one the box reached), then clicks one of the selected
# points: only that point stays selected. The wobbling click is in lane-click-one-of-group-wobble.yaml.
record: true
motion: true
save_project: fro2180 test
skip_reopen_check: "the selection and the cursor are runtime state a saved project does not hold; it opens on the lane with its 11 points"
steps:
  - openProject: {path: "${FIXTURES}/lane-box-edge.agsproj"}
  - wait: {}
  - click: {id: toggleBottomPanel}
  - wait: {}
  - expect: {id: automationLaneState, points: 11, selectedPoints: 0}
  - screenshot: {name: before}
  - drag: {from: automationLaneState, to: automationLaneState, fromX: 900, fromY: 8, toX: 1200, toY: 78, steps: 30}
  - wait: {settleMs: 500}
  - expect: {id: automationLaneState, selectedPoints: 3, cursorBeat: "48.0000"}
  - mark: {check: 1, name: box-cursor-on-last-point}
  # A click on the middle one of the three. One atomic `click`, not a press, a wobble and a release: a recorded step films a
  # frame after the press, and JUCE counts a press held over 300 ms as a drag, so on a busy machine the recorded wobble
  # kept the group (lane-click-one-of-group-wobble.yaml holds the wobbling click, not recorded).
  - click: {id: automationLaneState, x: 1056, y: 64}
  - wait: {settleMs: 500}
  - expect: {id: automationLaneState, selectedPoints: 1, cursorBeat: "44.0000", points: 11, dragging: false}
  - mark: {check: 2, name: click-picks-one-of-group}
