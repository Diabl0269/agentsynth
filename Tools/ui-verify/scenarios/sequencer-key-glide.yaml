# FRO1673: picking a Key on the Sequencer glides every bar to its snapped row and fades the written-note outline in; Cmd+Z
# and Cmd+Shift+Z glide them back and forth the same way (a Key is a parameter, not a pattern edit).
#
# What a user does: adds a Sequencer, writes E2 on step 1, picks C Natural Minor in the card's Key picker, then presses
# Cmd+Z and Cmd+Shift+Z. The bars slide each time.
motion: true
record: true
save_project: fro1673-key
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f, instant: "focus ring and caret appear on the library search field"}
  - wait: {}
  - key: {keys: cmd+a, instant: "the text selection highlight appears in the library search field"}
  - type: {text: sequencer}
  - wait: {}
  - key: {keys: down, instant: "the library list's focus ring moves to the next row"}
  - key: {keys: down, instant: "the library list's focus ring moves to the next row"}
  - key: {keys: return}
  - wait: {}
  - expect: {id: sequencerKey, showing: true, within_ms: 2000}
  - click: {id: Hide Panel}
  - wait: {}
  - click: {id: stepGrid, x: 20, y: 120, instant: "the focus ring moves to the canvas panel"}
  - key: {keys: down, instant: "the selected step cell moves"}
  - wait: {}
  - click: {id: sequencerKey}
  - expect: {id: keyPicker, showing: true, within_ms: 2000}
  - glide: {name: key-pick-glide, frames: 24, crop: {x: 940, y: 462, w: 520, h: 128}, do: {click: {id: "C Natural Minor, C D D# F G G# A#"}}}
  - mark: {check: 1, name: key-pick}
  - expect: {id: keyPicker, exists: false, within_ms: 2000}
  - expect: {id: stepGrid, playedNotes: "D#2,F3,F2,C3,F2,G#2,F2,C3", outlinedSteps: "1,3,4,6,7", within_ms: 1500}
  - wait: {settleMs: 800}
  - screenshot: {name: 1-natural-minor}
  - glide: {name: key-undo-glide, frames: 24, crop: {x: 940, y: 462, w: 520, h: 128}, do: {key: {keys: cmd+z}}}
  - mark: {check: 2, name: key-undo}
  - wait: {settleMs: 600}
  - screenshot: {name: 2-after-undo}
  - glide: {name: key-redo-glide, frames: 24, crop: {x: 940, y: 462, w: 520, h: 128}, do: {key: {keys: cmd+shift+z}}}
  - mark: {check: 3, name: key-redo}
  - wait: {settleMs: 600}
  - expect: {id: stepGrid, outlinedSteps: "1,3,4,6,7", within_ms: 1500}
  - screenshot: {name: 3-after-redo}
