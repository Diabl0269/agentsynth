# Bug: a knob moved by a modulation showed its ring stepping at 15 Hz (the card's timer), so an LFO on a filter cutoff
# looked jerky next to the display's refresh rate.
#
# What a user does:
#   1. Opens a project with an LFO cabled to a Filter's Cutoff (fixture fro2396-lfo-filter.agsproj).
#   2. Opens the bottom panel (Cmd+J) and presses Play (Space). The Cutoff knob's ring moves with the LFO.
# The ring is stepped once per display frame while it moves, so the ring frame rate reads above 45 frames per second
# (a 60 Hz display; the old 15 Hz timer reads 15).
record: true
save_project: fro2396 lfo ring
skip_reopen_check: "the saved project holds no playback state; the ring frame rate only exists while it plays"
steps:
  - openProject: {path: "${FIXTURES}/fro2396-lfo-filter.agsproj"}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: space}
  - expect: {id: timelineTransportPlayStop, toggleState: true, within_ms: 3000}
  - expect: {id: modRingPump, ringFramesRunning: true, above: {ringFrameCount: 30}, within_ms: 8000}
  - wait: {settleMs: 2500}
  - expect: {id: modRingPump, above: {ringFramesPerSecond: 45}}
  - mark: {check: 1, name: ring-glides}
