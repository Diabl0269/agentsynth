# Bug: the Custom filter's Resonance peak stayed under 1 dB for the knob's first quarter and then shot up to 18 dB,
# unlike a resonant filter, whose peak grows about 20 dB per unit of Resonance from the start and narrows as it rises.
#
# What a user does: sets a Filter to Custom, opens Show Response, and turns Resonance from 0 to a quarter (a peak of
# about 4 dB already shows at the cutoff marker), to a half (10 dB) and to 90 % (a tall, narrow 25 dB peak).
