# FRO2057: the alert box's icon follows the Depth setting (Flat, Soft, Rich) in the neon theme.
#
# What a user does: in Settings > Appearance > Controls > Depth picks Flat, Soft and Rich, then clicks Keyboard Shortcuts >
# Reset to Defaults. The "Reset Shortcuts" warning shows its icon: Flat a bare triangle with "!" (no disc), Soft the lit
# disc, Rich the same disc and glyph with shadow and rim only (Rich never adds a shape). Proof marks:
# check 2, the alert at each level (depth-alerts-neon-flat, -soft, -rich).
