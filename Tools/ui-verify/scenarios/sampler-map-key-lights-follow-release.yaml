# FRO1885: a Sampler key lights while it is held (or clearly audible) and goes dark shortly after you let go, however long
# the instrument's release tail is. Before the fix the key stayed lit for the whole synthetic fade-out.
#
# What a user does (the SoundPacksTone fixture pack: a pitched "Test Tone" instrument):
#   1. Adds a Sampler, switches its Mode to Instrument and picks "Test Tone", then presses Edit map.
#   2. Holds the mouse on middle C (C3, key 60) of the map's keyboard: the key lights.
#   3. Lets go: the key goes dark within a fraction of a second (checked 450 ms later), while the Release knob (0.6 s)
#      is still fading the sound out underneath.
#   4. Closes the map and does the same on the card's own key strip.
# Needs the app to be the active application (the library search field must have keyboard focus).
record: true
save_project: sampler-map-key-lights
steps:
  - copyFixture: {name: SoundPacks, from: "${FIXTURES}/SoundPacksTone"}
  - restart: {}
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: "sampler"}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - click: {id: Hide Panel}
  - wait: {}
  - click: {id: Mode, x: 215, y: 12}
  - wait: {settleMs: 600}
  - expect: {id: "Instrument, none", showing: true, within_ms: 3000}
  - click: {id: "Instrument, none"}
  - wait: {settleMs: 800}
  - expect: {id: modMatrixPicker, showing: true, within_ms: 2000}
  - type: {text: "Test Tone"}
  - wait: {settleMs: 400}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - expect: {id: modMatrixPicker, exists: false, within_ms: 2000}
  - click: {id: Edit map}
  - wait: {settleMs: 800}
  - expect: {id: samplerMapBlocks, showing: true, within_ms: 3000}
  - audioPump: {run: true}
  - mouseDown: {id: samplerMapBlocks, x: 360, y: 30}
  - wait: {settleMs: 300}
  - expect: {id: samplerMapKeys, contains: {litKeys: "60"}}
  - mark: {check: 1, name: key-lit-while-held}
  - mouseUp: {id: samplerMapBlocks, x: 360, y: 30}
  - wait: {settleMs: 450}
  - expect: {id: samplerMapKeys, litKeys: "", within_ms: 500}
  - mark: {check: 2, name: key-dark-after-release}
  - audioPump: {run: false}
  - click: {id: Done}
  - wait: {settleMs: 600}
  - expect: {id: samplerMapBlocks, exists: false, within_ms: 3000}
  - audioPump: {run: true}
  - mouseDown: {id: "card:Sampler > 1 recording, one layer", x: 128, y: 45}
  - wait: {settleMs: 300}
  - mark: {check: 3, name: card-key-lit-while-held}
  - mouseUp: {id: "card:Sampler > 1 recording, one layer", x: 128, y: 45}
  - wait: {settleMs: 450}
  - mark: {check: 4, name: card-key-dark-after-release}
  - audioPump: {run: false}
