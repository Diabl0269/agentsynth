# Deleting a section with its bars closes up only the sections touching it: a section that starts after a gap keeps
# its place.
#
# What a user does: makes three sections (bar 1, bar 2 right after it, then an empty bar, then bar 4), selects Section 1
# and presses Backspace. Section 2 glides left to bar 1; Section 3, after the gap, does not move. Cmd+Z brings Section 1
# back and Section 2 glides to its place again.
record: true
save_project: sections-scattered
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  # Three sections: bar 1 (x 0..96), bar 2 (96..192), a gap (192..288), bar 4 (288..384); each opens its name, Return keeps it.
  - mouseDown: {id: timelineSectionStrip, x: 5, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 90, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 90, y: 12}
  - wait: {}
  - key: {keys: return}
  - mouseDown: {id: timelineSectionStrip, x: 101, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 186, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 186, y: 12}
  - wait: {}
  - key: {keys: return}
  - mouseDown: {id: timelineSectionStrip, x: 293, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 378, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 378, y: 12}
  - wait: {}
  - key: {keys: return}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 1:0.000:4.000:1/1;Section 2:4.000:4.000:1/1;Section 3:12.000:4.000:1/1", within_ms: 2000}
  - screenshot: {name: 1-three-sections}
  # Check 1: select Section 1 and delete it with its bars: Section 2 closes up to bar 1, Section 3 stays at bar 4.
  - click: {id: timelineSectionStrip, x: 40, y: 12}
  - expect: {id: timelineSections, selectedSection: "0.000", within_ms: 2000}
  - glide: {name: delete-closes-run, do: {key: {keys: backspace}}, frames: 8}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 2:0.000:4.000:1/1;Section 3:12.000:4.000:1/1", within_ms: 2000}
  - mark: {check: 1, name: delete-closes-run}
  # Check 2: Cmd+Z brings Section 1 back; Section 2 glides to its place and Section 3 never moved.
  - glide: {name: undo-brings-it-back, do: {key: {keys: cmd+z}}, frames: 8}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 1:0.000:4.000:1/1;Section 2:4.000:4.000:1/1;Section 3:12.000:4.000:1/1", within_ms: 2000}
  - mark: {check: 2, name: undo-restores-the-layout}
