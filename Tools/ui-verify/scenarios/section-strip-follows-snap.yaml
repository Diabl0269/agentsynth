# A section drawn on the Sections strip snaps to whole bars (the longer of Snap and a bar); holding Shift follows
# the timeline's Snap unit. With Snap on 1/4 (a beat), a plain drag from bar 1 to the middle of bar 3 makes a
# 12-beat section; the same drag holding Shift makes a 10-beat one, its right edge mid-bar.
#
# What a user does: new project, adds an Oscillator track, leaves Snap on 1/4, drags across the empty strip (plain, then undone, then holding Shift) from the
# start of bar 1 to the middle of bar 3 (24 px per beat at the default zoom, so x 236 is beat 9.83).
record: true
save_project: "fro1895 beat sections"
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  - expect: {id: timelineSnapCombo, text: "1/4", within_ms: 2000}
  # Check 1: a plain drag (no Shift) makes whole bars: bar 1 to the middle of bar 3 ends at the end of bar 3.
  - mouseDown: {id: timelineSectionStrip, x: 5, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 236, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 236, y: 12}
  - wait: {}
  - mark: {check: 1, name: plain-drag-whole-bars}
  - expect: {id: timelineSections, sections: "Section 1:0.000:12.000:1/1", within_ms: 2000}
  - key: {keys: cmd+z}
  - wait: {}
  # Check 2: holding Shift (moved in steps so the clip shows the outline growing) follows Snap (1/4): the same drag ends on a beat, not on a bar line.
  - mouseDown: {id: timelineSectionStrip, x: 5, y: 12, mods: shift}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 80, y: 12, mods: shift}
  - wait: {}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 160, y: 12, mods: shift}
  - wait: {}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 236, y: 12, mods: shift}
  - wait: {}
  - mouseUp: {id: timelineSectionStrip, x: 236, y: 12, mods: shift}
  - wait: {}
  - mark: {check: 2, name: section-ends-on-a-beat}
  - expect: {id: timelineSections, sections: "Section 1:0.000:10.000:1/1", within_ms: 2000}
