# A card's first lane is titled by what its control does, not "Hero": the Delay reads Time, the Reverb Size, the Gate
# Threshold and the Envelope Follower Sensitivity. Check 1, one still per theme.
#
# What a user does: opens a project with the four effect cards, reads the lane titles, then switches the theme
# (Settings, Appearance) three times: Neon, Warm, Daylight.
record: true
save_project: FRO2354 lane titles
settings:
  themeId: obsidian
  themeMode: Dark
steps:
  - copyFixture: {name: "fro2354-effects.agsproj"}
  - openProject: {path: "${SCRATCH}/fro2354-effects.agsproj"}
  - wait: {}
  - wait: {settleMs: 700}
  - wait: {settleMs: 800}
  - mark: {check: 1, name: themes-obsidian}
  - key: {keys: "cmd+,"}
  - wait: {}
  - click: {id: "settingsTab:Appearance"}
  - wait: {}
  - click: {id: "Theme gallery", x: 200, y: 72}
  - wait: {settleMs: 600}
  - key: {keys: escape}
  - wait: {settleMs: 800}
  - mark: {check: 1, name: themes-neon, before_s: 6}
  - key: {keys: "cmd+,"}
  - wait: {}
  - click: {id: "settingsTab:Appearance"}
  - wait: {}
  - click: {id: "Theme gallery", x: 200, y: 120}
  - wait: {settleMs: 600}
  - key: {keys: escape}
  - wait: {settleMs: 800}
  - mark: {check: 1, name: themes-warm, before_s: 6}
  - key: {keys: "cmd+,"}
  - wait: {}
  - click: {id: "settingsTab:Appearance"}
  - wait: {}
  - click: {id: "Theme gallery", x: 200, y: 120}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 600}
  - key: {keys: escape}
  - wait: {settleMs: 800}
  - mark: {check: 1, name: themes-daylight, before_s: 6}
