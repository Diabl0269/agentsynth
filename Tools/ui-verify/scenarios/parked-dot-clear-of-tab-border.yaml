# A parked cable's dot on a Pluck's tab button sits inside the button, clear of its left border (FRO2220).
#
# What a user does: opens a project with a Pluck whose card layout has three tabs and three LFOs (the Pluck's own card
# is a lane grid since FRO2160, so the tab strip comes from a card layout with tab sections), drops one LFO on Decay (String tab), one on Pick Position (Pick tab)
# and one on Tune (Tune tab) and stays on the Tune tab. The String and Pick tabs hold a cable each: its end waits on
# the left of that tab button with a dot. The dot lies fully inside its button with a gap to the border, in every
# theme (Obsidian, Neon, Warm, Daylight). Proof marks, check 1, one still per theme: themes-obsidian, themes-neon,
# themes-warm, themes-daylight.
motion: true
record: true
pop_check: {off: "the parked ends are placed by the tab strip's layout; the proof is where the dots sit, not a motion"}
save_project: fro2220 parked dot tab
settings:
  themeId: obsidian
  themeMode: Dark
steps:
  - openProject: {path: "${FIXTURES}/pluck-tabbed-layout.agsproj"}
  - wait: {settleMs: 600}
  - expect: {id: "card:Pluck > cardTabStrip", showing: true, within_ms: 3000}
  - drag: {from: "card:LFO 1", fromX: 352, fromY: 56, to: "card:Pluck > Decay"}
  - wait: {}
  - click: {id: "card:Pluck > cardTabStrip", x: 128, y: 12}   # the Pick tab
  - wait: {}
  - drag: {from: "card:LFO 2", fromX: 352, fromY: 56, to: "card:Pluck > Pick Position"}
  - wait: {}
  - click: {id: "card:Pluck > cardTabStrip", x: 216, y: 12}   # the Tune tab
  - wait: {}
  - drag: {from: "card:LFO 3", fromX: 352, fromY: 56, to: "card:Pluck > Tune"}
  - wait: {}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Decay}, within_ms: 3000}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Pick Position}}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Tune}}
  - expect: {id: "card:Pluck", contains: {modDots: "Tune modulation"}, within_ms: 3000}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Decay}, within_ms: 3000}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Pick Position}}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Tune}}
  - expect: {id: "card:Pluck", contains: {modDots: "Tune modulation"}, within_ms: 3000}
  - expect: {id: "card:Pluck", contains: {cableEndGliding: "false"}, within_ms: 2000}
  # The tab strip starts 12 px in from the card's left edge, so the String tab's left border is at x 12 and the Pick tab's at
  # x 97. A dot's centre sits 6 px in (radius 3.5 + border 1 + gap 1, rounded), so the dot's left edge is at 14.5 and
  # 99.5 (clear of the border at 12-13 and 97-98), on the strip's middle line (y 172).
  - expect: {id: "card:Pluck", contains: {cableEnds: "18 172; 102 172; 26 250 knob"}}
  - getState: {id: "card:Pluck"}
  - getState: {id: "card:Pluck > cardTabStrip"}
  - wait: {settleMs: 700}
  - mark: {check: 1, name: themes-obsidian}
  - key: {keys: "cmd+,"}
  - wait: {}
  - click: {id: "settingsTab:Appearance"}
  - wait: {}
  - click: {id: "Theme gallery", x: 200, y: 72}
  - wait: {settleMs: 600}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - mark: {check: 1, name: themes-neon}
  - key: {keys: "cmd+,"}
  - wait: {}
  - click: {id: "settingsTab:Appearance"}
  - wait: {}
  - click: {id: "Theme gallery", x: 200, y: 120}
  - wait: {settleMs: 600}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - mark: {check: 1, name: themes-warm}
  - key: {keys: "cmd+,"}
  - wait: {}
  - click: {id: "settingsTab:Appearance"}
  - wait: {}
  - click: {id: "Theme gallery", x: 200, y: 120}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 600}
  - key: {keys: escape}
  - wait: {settleMs: 600}
  - mark: {check: 1, name: themes-daylight}
