# Feature: a mixer column's insert, send and EQ rows are reached with Down, and Alt+Down moves the focused insert one
# place: the two modules' cards trade places along their row on the canvas, gliding, and one Cmd+Z puts back both.
#
# What a user does:
#   1. Starts a new project, adds an Oscillator track, opens the Mixer tab, opens the track on the canvas and zooms out:
#      its chain (Oscillator, ADSR, VCA, Gate, ...) sits on one row.
#   2. Clicks the strip's header and presses Down twice: the focus ring walks the insert rows to VCA (proof 1).
#   3. Presses Alt+Down: VCA moves below Gate, the focus stays on it, and on the canvas the two cards glide past each
#      other and trade places (proof 2).
#   4. Presses Cmd+Z: the order and both cards are back in one step.
record: true
save_project: mixer-insert-keys
steps:
  - click: {id: New empty project}                           # the welcome screen
  - wait: {}
  - key: {keys: cmd+j}                                       # the bottom panel
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  - click: {id: Mixer}                                       # the Mixer tab
  - click: {id: macroCard, clicks: 2}                        # open the track on the canvas
  - wait: {}
  - expect: {id: "card:VCA", exists: true}
  - expect: {id: "card:Gate", exists: true}
  - key: {keys: "cmd+-"}                                     # zoom out so the whole chain is on screen
  - key: {keys: "cmd+-"}
  - key: {keys: "cmd+-"}
  - wait: {}
  - screenshot: {name: 1-chain-on-canvas}
  - click: {id: mixerPanel, x: 310, y: 38}                   # empty space in the strip's header, beside its name
  - wait: {}
  - expect: {id: mixerFocusedColumn, focusedColumn: "Oscillator 1", focusedRowIndex: -1}
  - key: {keys: down}
  - expect: {id: mixerFocusedColumn, focusedRowIndex: 0, contains: {focusedRow: "Insert 1, Oscillator"}}
  - key: {keys: down}                                        # VCA, the insert before Gate
  - expect: {id: mixerFocusedColumn, focusedRowIndex: 1, contains: {focusedRow: "Insert 2, VCA"}}
  - mark: {check: 1, name: down-into-inserts}
  - key: {keys: alt+down}
  - mark: {check: 2, name: alt-down-swaps-cards}
  - expect: {id: mixerFocusedColumn, focusedRowIndex: 2, contains: {focusedRow: "Insert 3, VCA"}, within_ms: 2000}
  - screenshot: {name: 2-cards-swapped}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: mixerFocusedColumn, focusedRowIndex: 2, contains: {focusedRow: "Insert 3, Gate"}, within_ms: 2000}  # Gate is back below VCA
  - screenshot: {name: 3-undone}                             # and the VCA and Gate cards are back in their places
