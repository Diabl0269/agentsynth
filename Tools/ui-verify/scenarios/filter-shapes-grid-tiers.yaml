# Feature: grid lines in the Filter's Edit shapes window come in tiers (bright labelled guides, faint snap lines),
# the Guides pill hides only the labelled guides, and the line near the pointer lights up with its name.
#
# What a user does: sets a Filter to Custom, opens Edit shapes, picks Grid 1/3 oct, then turns Guides off and on.
record: true
save_project: filter-shapes-grid-tiers
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: filter}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {count: {prefix: "card:Filter", equals: 1}, within_ms: 1500}
  - click: {id: window, x: 1044, y: 603}
  - wait: {settleMs: 600}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: return, target: Edit shapes}
  - wait: {settleMs: 800}
  - expect: {id: Shape curve, exists: true, within_ms: 3000}
  - click: {id: "1/3 oct"}
  - wait: {}
  - screenshot: {id: "Filter shapes: Filter", name: guides-on}
  - click: {id: Guides}
  - wait: {}
  - screenshot: {id: "Filter shapes: Filter", name: guides-off}
  - click: {id: Guides}
  - wait: {}
  - screenshot: {id: "Filter shapes: Filter", name: guides-on-again}
