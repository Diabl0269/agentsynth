# Several mod cables on a Pluck's tabbed knobs met at one point and showed no mod dot.
#
# What a user does: opens a project with a Pluck whose card layout has three tabs (the Pluck's own card is a lane grid
# since FRO2160, so the tab strip comes from a card layout with tab sections; fixture pluck-tabbed-layout.agsproj) and
# three LFOs, and drops one LFO on Decay (String tab), one on Pick Position (Pick
# tab) and one on Tune (Tune tab). Each cable ends on its own knob with a mod dot while that knob's tab is shown; the
# cables of the other tabs wait apart, each on the left edge of the tab button holding its knob, with a dot. Switching
# tabs glides the ends.
# The glide is stepped frame by frame in CableEndGlideTests (TabbedKnobCables); here the strips film it.
motion: true
record: true
save_project: fro1797 pluck tune lfo
steps:
  - openProject: {path: "${FIXTURES}/pluck-tabbed-layout.agsproj"}
  - wait: {settleMs: 600}
  - expect: {id: "card:Pluck > cardTabStrip", showing: true, within_ms: 3000}
  - drag: {from: "card:LFO 1", fromX: 352, fromY: 56, to: "card:Pluck > Decay"}
  - wait: {}
  - click: {id: "card:Pluck > cardTabStrip", x: 128, y: 12}   # the Pick tab
  - wait: {}
  - drag: {from: "card:LFO 2", fromX: 352, fromY: 56, to: "card:Pluck > Pick Position"}
  - wait: {}
  - click: {id: "card:Pluck > cardTabStrip", x: 216, y: 12}   # the Tune tab
  - wait: {}
  - drag: {from: "card:LFO 3", fromX: 352, fromY: 56, to: "card:Pluck > Tune"}
  - wait: {}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Decay}, within_ms: 3000}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Pick Position}}
  - expect: {id: "card:Pluck", contains: {cabledTargets: Tune}}
  - expect: {id: "card:Pluck", contains: {modDots: "Tune modulation"}, within_ms: 3000}
  - getState: {id: "card:Pluck"}
  - screenshot: {id: "card:Pluck", name: tune-tab-own-dot}
  # Check 2: on the Tune tab, Tune's cable ends on its knob with its dot; Decay's and Pick Position's wait apart.
  - mark: {check: 2, name: tune-tab-cables-apart}
  - glide: {name: to-string-tab, frames: 10, crop: {x: 660, y: 330, w: 320, h: 360}, do: {click: {id: "card:Pluck > cardTabStrip", x: 40, y: 12}}}
  - wait: {}
  - expect: {id: "card:Pluck", contains: {modDots: "Decay modulation", cableEndGliding: "false"}, within_ms: 2000}
  - getState: {id: "card:Pluck"}
  # Check 1: the click that left the Tune tab glided Tune's cable end to the Tune tab's button, with its dot; the
  # String tab shows Decay's dot and cable end.
  - mark: {check: 1, name: tune-tab-parked}
  - glide: {name: to-pick-tab, frames: 10, crop: {x: 660, y: 330, w: 320, h: 360}, do: {click: {id: "card:Pluck > cardTabStrip", x: 128, y: 12}}}
  - wait: {}
  - expect: {id: "card:Pluck", contains: {modDots: "Pick Position modulation", cableEndGliding: "false"}, within_ms: 2000}
  - getState: {id: "card:Pluck"}
  # Check 3: the Pick tab shows Pick Position's dot.
  - mark: {check: 3, name: pick-tab-own-dot}
  # Keyboard: Tab from the Pick Position knob reaches its dot.
  - click: {id: "card:Pluck > Pick Position"}
  - key: {keys: tab}
  - wait: {}
  - mark: {check: 4, name: pick-dot-focus-ring}
