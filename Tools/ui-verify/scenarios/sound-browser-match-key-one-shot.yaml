# Match key said nothing for a sound that is not a loop, so a switch that was on looked broken. With the switch on, a
# selected one-shot now says "Match key applies to loops; this is a one-shot and plays as recorded" in the footer line
# and in the switch's tooltip; with it off the footer stays quiet.
#
# What a user does: opens the Sounds view, searches for a one-shot, selects it, turns Match key on.
record: true
save_project: fro1730 match key one-shot
settings:
  librarySidebarView: sounds
  soundBrowserFolders: "${FIXTURES}/sounds-oneshot"
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - expect: {id: soundBrowser, showing: true, within_ms: 3000}
  - click: {id: "Search sounds"}
  - type: {text: snare}
  - wait: {}
  - key: {keys: down}
  - wait: {}
  - expect: {id: soundBrowser, contains: {selectedName: "snare"}}
  - expect: {id: "Match key", toggleState: false}
  - expect: {id: "Match key", tooltip: "Play loops in the song's key"}
  - click: {id: "Match key"}
  - mark: {check: 1, name: one-shot-match-key-on}
  - wait: {}
  - expect: {id: "Match key", toggleState: true}
  - expect: {id: "Match key", tooltip: "Match key applies to loops; this is a one-shot and plays as recorded"}
  - expect: {id: soundBrowser, contains: {footerLine: "Match key applies to loops; this is a one-shot and plays as recorded"}}
