# EQ dots follow the shared selection rules: a click anywhere in the window that is not a control or the curve ends the
# selection, and a plain click on one dot of a group selects just that dot even when the pointer wobbles a pixel or two.
#
# What a user does: opens the Parametric EQ window, adds three bands, boxes all three, clicks empty space in the band
# strip (all three deselect). Boxes them again and clicks one of the dots, the pointer moving two pixels before the
# release (only that dot stays selected).
motion: true
pop_check: {off: "selection halos fade through the existing dot tween; no popup opens"}
record: true
save_project: eq-click-deselects-and-collapses
steps:
  - copyFixture: {name: two-tracks-folded.agsproj}
  - openProject: {path: "${SCRATCH}/two-tracks-folded.agsproj"}
  - wait: {}
  - click: {id: "card:Parametric EQ 2 > Open EQ Window"}
  - wait: {settleMs: 800}
  - expect: {id: eqWindowCurve, exists: true, within_ms: 3000}
  - click: {id: eqWindowCurve, x: 100, y: 280, clicks: 2}
  - wait: {settleMs: 400}
  - click: {id: eqWindowCurve, x: 400, y: 120, clicks: 2}
  - wait: {settleMs: 400}
  - click: {id: eqWindowCurve, x: 700, y: 240, clicks: 2}
  - wait: {settleMs: 600}
  - drag: {from: eqWindowCurve, to: eqWindowCurve, fromX: 40, fromY: 20, toX: 780, toY: 330, steps: 24}
  - wait: {settleMs: 700}
  - expect: {id: eqWindowStrip, selectedCount: 3, within_ms: 2000}
  # (a) A click on empty space in the band strip ends the selection.
  - click: {id: eqWindowStrip, x: 400, y: 8}
  - wait: {settleMs: 600}
  - expect: {id: eqWindowStrip, selectedCount: 0, within_ms: 2000}
  - mark: {check: 1, name: click-elsewhere-deselects}
  # (b) A click on one dot of a group, the pointer wobbling two pixels, selects just that dot.
  - drag: {from: eqWindowCurve, to: eqWindowCurve, fromX: 40, fromY: 20, toX: 780, toY: 330, steps: 24}
  - wait: {settleMs: 700}
  - expect: {id: eqWindowStrip, selectedCount: 3, within_ms: 2000}
  - mouseDown: {id: eqWindowCurve, x: 400, y: 120}
  - mouseMoveHeld: {id: eqWindowCurve, x: 402, y: 121}
  - mouseUp: {id: eqWindowCurve, x: 402, y: 121}
  - wait: {settleMs: 700}
  - expect: {id: eqWindowStrip, selectedCount: 1, selectedBand: 2, within_ms: 2000}
  - mark: {check: 2, name: wobbly-click-picks-one-dot}
