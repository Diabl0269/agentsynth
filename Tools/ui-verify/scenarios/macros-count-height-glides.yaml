# The Macros card's Controllers count changes its height: the card glides to the new height instead of snapping, the knobs
# that go leave and the ones that come grow in, and Cmd+Z glides it back in one step. The `glide` steps film the frames
# (the glide is 160 ms, one screenshot would catch a blur or the end); each mark sits on the landed state.
# The output jacks ride the same change (FRO1941): a new jack and its name fade in as its controller grows, a removed one
# fades out and the cable on it (M5 here) retracts. Each recorded frame moves the 160 ms fade on by one 16 ms step, so
# the strips show each jack part-way. MacroCountGlide.* covers the frame heights, the
# jack alphas, Reduce Motion and Off headlessly.
motion: true
pop_check: {undo: false}
record: true
save_project: fro1859 macros controllers
steps:
  - openProject: {path: "${FIXTURES}/macros-bank-cabled.agsproj"}
  - wait: {}
  - wheel: {id: window, x: 800, y: 450, dx: -6.2, dy: 2.7}
  - wait: {}
  - screenshot: {name: 1-bank-at-eight}
  - click: {id: Controllers}
  # Eight to five keeps two rows of knobs (the card keeps its height); the step to four drops the second row.
  - key: {keys: down, target: Controllers}
  - key: {keys: down, target: Controllers}
  - key: {keys: down, target: Controllers}
  - wait: {settleMs: 600}
  - glide: {name: count-down, frames: 14, do: {key: {keys: down, target: Controllers}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 2-bank-one-row}
  - mark: {check: 1, name: card-and-jack-fade-out-as-the-count-drops}
  - glide: {name: count-up, frames: 14, do: {key: {keys: up, target: Controllers}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 3-bank-two-rows}
  - mark: {check: 2, name: card-and-jack-fade-in-as-the-count-rises}
  - glide: {name: undo-glides-back, frames: 14, do: {key: {keys: cmd+z}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 4-after-undo}
  - mark: {check: 3, name: undo-fades-the-jack-back}
  - glide: {name: redo-glides-forward, frames: 14, do: {key: {keys: cmd+shift+z}}}
  - wait: {settleMs: 600}
  - screenshot: {name: 5-after-redo}
  - mark: {check: 4, name: redo-fades-the-jack-out-again}
  - glide: {name: undo-again, frames: 14, do: {key: {keys: cmd+z}}}
  - wait: {settleMs: 600}
