# Check: a harder note is a louder note through Poly MIDI -> poly ADSR (Velocity 100) -> VCA (FRO2008, for FRO1422 #11).
# The level comes out as numbers: `audioPump {levels}` plays the note at velocities 1, 40, 63 and 127 through a MIDI
# Keyboard cabled into Poly MIDI, and fails naming the numbers unless every RMS is above silence and each is
# strictly louder than the one before (docs/development/test-mode.md#audio-pump). The run log holds the RMS and
# peak of each velocity.
#
# What a user does:
#   1. Starts a new project, adds an Oscillator track, turns the voice toggle to poly and ungroups the track's macro
#      (Cmd+Shift+G), so Poly MIDI, Oscillator, ADSR and VCA sit on the canvas.
#   2. Adds a MIDI Keyboard and cables its Midi output into Poly MIDI's Midi input.
#   3. Drags the ADSR's Velocity fader to 100.
#   4. Plays a note at velocities 1, 40, 63 and 127: each is heard and each is louder than the last.
save_project: fro2008 velocity levels
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  - click: {id: trackVoiceToggle}
  - wait: {}
  - click: {id: macroCard, y: 8}
  - key: {keys: cmd+shift+g}
  - wait: {}
  - expect: {count: {prefix: "card:Poly MIDI", equals: 1}, within_ms: 1500}
  - expect: {count: {prefix: "card:ADSR", equals: 1}, within_ms: 1500}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: midi keyb}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {count: {prefix: "card:MIDI Keyboard", equals: 1}, within_ms: 1500}
  - click: {id: Hide Panel}
  - wait: {}
  - click: {id: Auto Arrange}
  - wait: {}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - key: {keys: cmd+-}
  - wait: {}
  - drag: {from: "card:MIDI Keyboard > Midi output", to: "card:Poly MIDI > Midi input"}
  - wait: {}
  - drag: {from: "card:ADSR > Velocity", to: "card:ADSR > Velocity", fromX: 10, toX: 120, fromY: 5, toY: 5, steps: 8}
  - wait: {}
  - expect: {id: "card:ADSR > Velocity", value: 100.0, within_ms: 2000}
  - audioPump: {run: true}
  - audioPump: {levels: {note: 60, velocities: [1, 40, 63, 127], ms: 300, releaseMs: 500, requireRising: true}}
  - audioPump: {run: false}
  - screenshot: {name: velocity-levels}
