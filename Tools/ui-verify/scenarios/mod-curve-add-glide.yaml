# A dot added to a modulation curve by a double-click on empty space does not pop: the dot grows in and the line eases
# into its new shape; Cmd+Z glides it back out and Cmd+Shift+Z in again.
#
# What a user does:
#   1. Opens the Mod Matrix, the curve box and its Enlarge window (a straight line).
#   2. Double-clicks empty space above the line: the dot grows where it was clicked while the line bends to pass
#      through it (a strip of frames, one of them with a half-grown dot and an in-between line).
#   3. Presses Cmd+Z: the dot shrinks away and the line eases straight again. Cmd+Shift+Z brings both back.
# The small box and the window are one editor, so the unit tests drive both (ModCurveBoxTests). Proof marks, each on
# the landed state after its glide: 1 add-glides (dot and bent line), 2 undo-glides (straight again), 3 redo-glides.
record: true
motion: true
save_project: fro1878-curve-add-glide
steps:
  - openProject: {path: "${FIXTURES}/mod-dot.agsproj"}
  - wait: {}
  - click: {id: toggleModMatrix}
  - wait: {}
  - click: {id: modCurve}
  - wait: {}
  - click: {id: "Enlarge curve editor"}
  - wait: {}
  - expect: {id: modCurveWindow, showing: true, within_ms: 2000}
  - slowMotion: {factor: 4}
  - glide: {name: add-dot, frames: 40, crop: {x: 540, y: 255, w: 520, h: 360}, do: {click: {id: modCurveWindowEditor, x: 300, y: 120, clicks: 2}}}
  - wait: {}
  - mark: {check: 1, name: add-glides}
  - glide: {name: undo-add, frames: 40, crop: {x: 540, y: 255, w: 520, h: 360}, do: {key: {keys: "cmd+z", target: modCurveWindow}}}
  - wait: {}
  - mark: {check: 2, name: undo-glides}
  - glide: {name: redo-add, frames: 40, crop: {x: 540, y: 255, w: 520, h: 360}, do: {key: {keys: "cmd+shift+z", target: modCurveWindow}}}
  - wait: {}
  - mark: {check: 3, name: redo-glides}
  - slowMotion: {factor: 1}
