# Bug (FRO1830): bypassing a module in a mixer strip's insert list sent the list back to the top, because the edit
# rebuilds the column as new lists. The scrolled list must stay put (the rows keep their places), the bypassed row dims
# in place, and Cmd+Z leaves the list where it is too.
#
# What a user does (the Compressor row starts dimmed; its bypass button turns it on):
#   1. Starts a new project, adds an Oscillator track, opens the Mixer tab and adds inserts until the strip's insert
#      list scrolls (setup, before the gesture).
#   2. Scrolls the list down to its last rows.
#   3. Clicks the bypass button of a row low in the list: the row changes look where it is and the list does not move (proof 1).
#   4. Presses Cmd+Z: the row is back to dimmed and the list still has not moved (proof 2).
record: true
pop_check: {off: "the bypass itself lands at once by design; this scenario is about where the list sits after it, and the check would click the toolbar Undo and Redo into the proof frames"}
save_project: fro1830 bypass keeps scroll
steps:
  - click: {id: New empty project}                           # the welcome screen
  - wait: {}
  - key: {keys: cmd+j}                                       # the bottom panel
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  - click: {id: Mixer}                                       # the Mixer tab
  - wait: {}
  - expect: {id: mixerPanel, showing: true, within_ms: 3000}
  - screenshot: {name: 1-before-setup}
  - wheel: {id: mixerInsertList, dy: -1.0}
  - wait: {settleMs: 400}
  - screenshot: {id: screen, name: 2-scrolled}
  - click: {id: window, x: 329, y: 623}                      # the Compressor row's bypass button, low in the scrolled list
  - wait: {settleMs: 600}
  - screenshot: {id: screen, name: 3-bypassed}
  - mark: {check: 1, name: bypass-keeps-the-list-scrolled}
  - glide: {name: undo, frames: 12, do: {key: {keys: cmd+z}}}
  - wait: {settleMs: 600}
  - screenshot: {id: screen, name: 4-undone}
  - mark: {check: 2, name: undo-keeps-the-list-scrolled}
  - glide: {name: redo, frames: 12, do: {key: {keys: cmd+shift+z}}}
  - wait: {settleMs: 600}
  - screenshot: {id: screen, name: 5-redone}
