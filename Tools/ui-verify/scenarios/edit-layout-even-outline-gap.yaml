# In Edit Layout each control's dashed outline hugs its caption, its widget and (on a lane card) the lane Sync button
# at the end of its caption with one even gap on every side, and no two outlines touch: the Delay's Sync pill sits
# inside the Time outline instead of poking out of it. Checks 1-4; the Daylight pass is edit-layout-even-outline-gap-daylight.yaml.
#
# What a user does: opens a project with those four cards, right-clicks a card's title, picks Edit Layout..., looks
# at the outlines, presses Escape to leave, and does the same on the next card.
record: true
save_project: FRO2267 even outline gap
steps:
  - copyFixture: {name: "fro2144-four-cards.agsproj"}
  - openProject: {path: "${SCRATCH}/fro2144-four-cards.agsproj"}
  - wait: {}
  - click: {id: "card:Filter", x: 60, y: 10, button: right}
  - wait: {settleMs: 500}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {settleMs: 800}
  - screenshot: {name: filter-edit-layout}
  - mark: {check: 1, name: filter-outlines-even-gap}
  - key: {keys: escape}
  - wait: {settleMs: 600}
