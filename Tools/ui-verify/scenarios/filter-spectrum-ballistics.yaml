# Bug: the Filter's spectrum (the card's Show Spectrum and the Custom shape window's Show spectrum) smoothed per
# frame, so it rose and fell at different speeds at different frame rates and showed a sine several dB under its
# level; a released note took seconds to fade.
#
# What a user does: sets a Filter to Custom, opens Show Response and Show Spectrum on the card, then opens Edit shapes
# and turns on its Show spectrum. Both views draw the same analyser's trace (test mode has no audio device, so the
# trace rests at its floor; the timing and level are pinned by the analyser's unit tests).
record: true
save_project: filter-spectrum-ballistics
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: filter}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {count: {prefix: "card:Filter", equals: 1}, within_ms: 1500}
  - click: {id: window, x: 1044, y: 603}                       # the Filter Type combo (its label shares the title)
  - wait: {settleMs: 600}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {id: Edit shapes, exists: true, within_ms: 3000}
  - key: {keys: cmd+-}                                         # zoom out so the whole Custom card fits
  - key: {keys: cmd+-}
  - wait: {}
  - drag: {from: Patch canvas, to: Patch canvas, fromX: 300, fromY: 750, toX: 300, toY: 350}   # pan the card's foot into view
  - wait: {}
  - wait: {}
  - click: {id: Show Response}
  - wait: {settleMs: 600}
  - expect: {id: Show Response, toggleState: true, within_ms: 3000}
  - click: {id: Show Spectrum}
  - wait: {settleMs: 600}
  - expect: {id: Show Spectrum, toggleState: true, within_ms: 3000}
  - expect: {id: Show Spectrum, contains: {tooltip: "before any volume stage"}}
  - screenshot: {id: "card:Filter", name: card-spectrum-on}
  - click: {id: Edit shapes}
  - wait: {}
  - expect: {id: Show spectrum, exists: true, within_ms: 5000}
  - click: {id: Show spectrum}
  - wait: {settleMs: 600}
  - expect: {id: Show spectrum, toggleState: true, within_ms: 3000}
  - expect: {id: Show spectrum, contains: {tooltip: "before any volume stage"}}
  - expect: {id: Show Spectrum, toggleState: true}             # the card's toggle stays on: one analyser each, same buffer
  - screenshot: {id: "Filter shapes: Filter", name: window-spectrum-on}
  - screenshot: {name: canvas-spectrum-on}
