# The Randomize button toggles its panel: a second press closes it (one fade, no re-open), and Esc closes it.
#
# What a user does:
#   1. Opens a project with a Sequencer (fixture clip-and-sequencer.agsproj) and presses Randomize: the panel opens.
#   2. Presses Randomize again: the panel closes (it does not close and flicker open again).
#   3. Presses Randomize once more, then Esc: the panel closes.
record: true
save_project: randomize-toggle
steps:
  - openProject: {path: "${FIXTURES}/clip-and-sequencer.agsproj"}
  - wait: {}
  - key: {keys: cmd+j}
  - wait: {}
  - click: {id: Randomize notes in the scale}
  - wait: {}
  - expect: {id: randomizeRangePicker, showing: true, within_ms: 2000}
  - mark: {check: 1, name: randomize-open}
  - click: {id: Randomize notes in the scale}
  - wait: {}
  - expect: {id: randomizeRangePicker, exists: false, within_ms: 2000}
  - mark: {check: 2, name: randomize-second-click-closes}
  - click: {id: Randomize notes in the scale}
  - wait: {}
  - expect: {id: randomizeRangePicker, showing: true, within_ms: 2000}
  - key: {keys: escape}
  - wait: {}
  - expect: {id: randomizeRangePicker, exists: false, within_ms: 2000}
  - mark: {check: 3, name: randomize-esc}
