# Sound browser rows: every row starts with a line icon (folder, loop, star, clock, pack, plus), a file named in lower
# case shows a capital first letter, and the Get more heading folds. The recording shows the Sounds view, a search, a
# selected loop row (accent icon) and the footer; the Get more heading shows only when the hosted pack list loads,
# which a scenario without network does not get, so the fold itself is covered by SoundBrowserGetMoreTests.
#
# What a user does: opens the Sounds view over the fixture folder, looks at the rows, searches for a loop and selects it.
# The row text and the tooltip read "Test loop 120bpm Am" while the stored name stays "test loop 120bpm Am".
record: true
save_project: sound-browser-rows
settings:
  librarySidebarView: sounds
  soundBrowserFolders: "${FIXTURES}/sounds"
steps:
  - openProject: {path: "${FIXTURES}/macros.agsproj"}
  - wait: {}
  - expect: {id: soundBrowser, showing: true, within_ms: 3000}
  - screenshot: {id: soundBrowser, name: places-with-icons}
  - click: {id: "Search sounds"}
  - type: {text: test loop}
  - wait: {}
  - key: {keys: down}
  - wait: {}
  - screenshot: {id: soundBrowser, name: loop-row-selected}
  - expect: {id: soundBrowser, contains: {selectedName: "test loop"}}
