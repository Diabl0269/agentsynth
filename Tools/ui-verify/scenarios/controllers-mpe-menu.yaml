# New: a controller's right-click menu gains an MPE submenu (Auto, Off, Lower zone, Upper zone, Both zones) that
# sets how the controller's MPE member channels are decided, with a tick on the current mode.
#
# What a user does: opens the Controllers tab, adds a virtual controller (no device), right-clicks its row, opens
# MPE and chooses "Lower zone (15 channels)", then right-clicks again: the MPE submenu shows Lower zone ticked.
record: true
save_project: controllers-mpe-menu
steps:
