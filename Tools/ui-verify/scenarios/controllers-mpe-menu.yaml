  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
  - key: {keys: down, target: addControllerDeviceCombo}
