# FRO1642: undo/redo of a Parametric EQ band move, add or remove used to snap the dot and curve to the new place; they
# now glide (about 160 ms) on the card curve, the EQ window curve and the mixer EQ thumbnail.
#
# What a user does: opens the Parametric EQ window from its card, double-clicks the curve to add band 1, drags the band
# far, then presses Cmd+Z in the window: the dot and curve glide back to where the band was, with frames between old and
# new. Cmd+Shift+Z glides forward. Undoing the add fades the band out; redo brings it back.
# The frame shows all three surfaces: the EQ window curve (big), the card's curve (right) and the Oscillator 2 strip's EQ
# thumbnail in the Mixer (bottom left). Each `glide` films the motion frame by frame (proof/<name>-strip.png); each mark sits on the landed state.
# EqUndoGlideTests and UndoGlideSurfacesEq cover the first, middle and last frames headlessly (and Reduce Motion).
motion: true
record: true
save_project: eq-undo-glide
steps:
  - copyFixture: {name: two-tracks-folded.agsproj}
  - openProject: {path: "${SCRATCH}/two-tracks-folded.agsproj"}
  - wait: {}
  - key: {keys: cmd+j}                                        # the bottom panel, on the Mixer tab: the strip's EQ thumbnail
  - wait: {settleMs: 800}
  - click: {id: "dockTab:Mixer"}
  - expect: {id: "dockTab:Mixer", showing: true}
  - wait: {settleMs: 800}
  - click: {id: "card:Parametric EQ 2 > Open EQ Window"}
  - wait: {settleMs: 800}
  - expect: {id: eqWindowCurve, exists: true, within_ms: 3000}
  - click: {id: eqWindowCurve, x: 120, y: 60, clicks: 2}
  - wait: {settleMs: 800}
  - screenshot: {name: 1-band-added}
  - drag: {from: eqWindowCurve, to: eqWindowCurve, fromX: 120, fromY: 60, toX: 330, toY: 140, steps: 12}
  - wait: {settleMs: 800}
  - screenshot: {name: 2-band-dragged-far}
  - glide: {name: undo-move, frames: 14, crop: {x: 340, y: 220, w: 1260, h: 540}, do: {key: {keys: cmd+z, target: eqWindowCurve}}}
  - wait: {settleMs: 600}
  - mark: {check: 1, name: undo-move-landed}
  - screenshot: {name: 3-after-undo}
  - glide: {name: redo-move, frames: 14, crop: {x: 340, y: 220, w: 1260, h: 540}, do: {key: {keys: "cmd+shift+z", target: eqWindowCurve}}}
  - wait: {settleMs: 600}
  - mark: {check: 2, name: redo-move-landed}
  - screenshot: {name: 4-after-redo}
  - key: {keys: cmd+z, target: eqWindowCurve}
  - wait: {settleMs: 600}
  - glide: {name: undo-add, frames: 14, crop: {x: 340, y: 220, w: 1260, h: 540}, do: {key: {keys: cmd+z, target: eqWindowCurve}}}
  - wait: {settleMs: 600}
  - mark: {check: 3, name: undo-add-landed}
  - screenshot: {name: 5-after-undo-add}
  - key: {keys: "cmd+shift+z", target: eqWindowCurve}
  - wait: {settleMs: 600}
  - key: {keys: "cmd+shift+z", target: eqWindowCurve}
  - wait: {settleMs: 800}
