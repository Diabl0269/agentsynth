# FRO2056: knobs and faders follow the Depth setting (Flat, Soft, Rich) in the neon theme.
#
# What a user does: opens a project with module cards and the Mixer, then picks Flat, Soft and Rich in Settings >
# Appearance > Controls > Depth. Every knob cap and fader cap re-skins at each pick: Flat is a plain cap with no shadow or
# bevel, Soft is today's look, Rich adds a rim light on the top left and a deeper, larger shadow, the same on a knob and
# a fader. Proof marks: check 1, the same screen at each level (depth-knobs-neon-flat, -soft, -rich); close-ups of a
# Compressor knob (depth-knob-neon-*) and the Lead mixer fader (depth-fader-neon-*) beside them.
settings:
  themeId: neon
  themeMode: Dark
