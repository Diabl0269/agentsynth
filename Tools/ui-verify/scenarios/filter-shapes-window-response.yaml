# Feature: in the Filter's Edit shapes window the Show Response button (left of Show Spectrum, named like the card's
# toggle) draws the filter's live frequency response over the curve editor, whichever dot or the cursor is selected.
# Selecting the cursor or a dot no longer turns it on or off.
#
# What a user does: sets a Filter to Custom, opens Edit shapes (a shape dot is selected, Show Response is off: no
# response), clicks Show Response (the response appears with the dot still selected), clicks the morph cursor and the
# "ah" dot (it stays), then clicks Show Response again (it goes).
record: true
save_project: filter-shapes-response
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - key: {keys: cmd+a}
  - type: {text: filter}
  - wait: {}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - expect: {count: {prefix: "card:Filter", equals: 1}, within_ms: 1500}
  - click: {id: window, x: 1044, y: 603}                       # the Filter Type combo (its label shares the title)
  - wait: {settleMs: 600}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: down}
  - key: {keys: return}
  - wait: {}
  - key: {keys: return, target: Edit shapes}
  - wait: {settleMs: 800}
  - expect: {id: Shape curve, exists: true, within_ms: 3000}
  - screenshot: {id: "Filter shapes: Filter", name: shapes-dot-selected-response-off}
  - click: {id: "Filter shapes: Filter > Show Response"}
  - wait: {}
  - expect: {id: "Filter shapes: Filter > Show Response", toggleState: true, within_ms: 3000}
  - screenshot: {id: "Filter shapes: Filter", name: shapes-dot-selected-response-on}
  - click: {id: "Filter shapes: Filter", x: 184, y: 174}       # the morph cursor in the window's map
  - wait: {}
  - screenshot: {id: "Filter shapes: Filter", name: shapes-cursor-selected-response-on}
  - click: {id: "Filter shapes: Filter", x: 101, y: 99}        # the "ah" dot
  - wait: {}
  - click: {id: "Filter shapes: Filter > Show Response"}
  - wait: {}
  - expect: {id: "Filter shapes: Filter > Show Response", toggleState: false, within_ms: 3000}
  - screenshot: {id: "Filter shapes: Filter", name: shapes-dot-selected-response-off-again}
