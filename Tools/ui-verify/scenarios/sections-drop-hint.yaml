# Dragging a Sections-strip block says what a release does: a small pill beside the drop line reads "Release to insert
# here" (the default) and, with Shift held, "Release to replace what is here"; the words fade in with the lift and
# cross-fade when Shift flips the mode.
#
# What a user does: makes two sections side by side (bar 5, bar 6), presses the second and drags it over the first: the pill shows
# beside the drop line. Holds Shift: the words change to "Release to replace what is here" and the block it would replace dims.
# Releases with Shift held: the second section replaces the first. Undo puts it back.
record: true
motion: true
save_project: "fro1755 drop words"
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+j}
  - click: {id: timelineAddTrackButton}
  - wait: {}
  - click: {id: "modMatrixPicker > Oscillator, Track"}
  - wait: {}
  # Two sections side by side: bar 5 (x 384..480) and bar 6 (480..576); each opens its name, Return keeps it.
  - mouseDown: {id: timelineSectionStrip, x: 389, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 474, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 474, y: 12}
  - wait: {}
  - key: {keys: return}
  - mouseDown: {id: timelineSectionStrip, x: 485, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 570, y: 12}
  - mouseUp: {id: timelineSectionStrip, x: 570, y: 12}
  - wait: {}
  - key: {keys: return}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 1:16.000:4.000:1/1;Section 2:20.000:4.000:1/1", within_ms: 2000}
  # Check 1: press Section 2 (grabbed 40 px in) and drag its left edge to bar 5's start: it would land before Section 1,
  # which moves later, so the pill says "Release to insert here" and both blocks are in frame.
  - mouseDown: {id: timelineSectionStrip, x: 520, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 480, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 440, y: 12}
  - mouseMoveHeld: {id: timelineSectionStrip, x: 424, y: 12}
  - wait: {}
  - mark: {check: 1, name: drop-hint}
  # Check 2: Shift pressed mid-drag: the words change to "Release to replace what is here".
  - glide: {name: hint-swap, do: {mouseMoveHeld: {id: timelineSectionStrip, x: 426, y: 12, mods: shift}}, frames: 8}
  - wait: {}
  - mark: {check: 2, name: drop-hint-cover}
  - mouseUp: {id: timelineSectionStrip, x: 426, y: 12, mods: shift}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 2:16.000:4.000:1/1", within_ms: 2000}
  - key: {keys: cmd+z}
  - wait: {}
  - expect: {id: timelineSections, sections: "Section 1:16.000:4.000:1/1;Section 2:20.000:4.000:1/1", within_ms: 2000}
