# Feature: the Sequencer and the Parametric EQ cards use the module lane grid. The Sequencer has its step grid on top, a
# Run mode row, then Pitch, Shape and Time lanes; BPM dims (never hides) while Follow transport is on, so the card keeps
# its size. The EQ has its curve on top with Show Spectrum and Open EQ Window as small icons in the curve's corner, the
# band chips under it, a Main lane titled after the selected band (Freq, Gain, Q as three large knobs) and an Out lane
# (Mix, Pan, Output) at the bottom right; the card never changes size when the selection changes and grows only by chip
# rows.
#
# What a user does:
#   1. Starts an empty project, opens the library (Cmd+F) and adds a Sequencer and a Parametric EQ.
#   2. Clicks the Sequencer's Follow transport pill: BPM dims and nothing moves (check 1).
#   3. Clicks the EQ's + chip four times, then band chip 2: the knobs show that band, the card keeps its size (check 2).
#   4. Adds bands up to 12: the chip strip wraps to a second row and the card grows by that row (check 3).
#   5. Selects the EQ card, presses Return and walks Tab: icons, chips, the Main lane, then Out (check 4).
#   6. Opens Settings > Appearance and picks each theme in turn (check 5).
# Needs the app to be the active application (the library search field must have keyboard focus).
record: true
save_project: fro2163 seq eq lanes
settings:
  themeId: obsidian
  themeMode: Dark
steps:
  - click: {id: New empty project}
  - wait: {}
  - key: {keys: cmd+f}
  - wait: {}
  - click: {id: Hide Library}
