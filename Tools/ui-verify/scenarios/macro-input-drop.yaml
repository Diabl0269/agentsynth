# Check: a cable dragged from a module OUTSIDE a macro onto the jack of a folded macro's input crosses the outer
# macro's border through a new input of that macro, the way a cable out of the folded macro leaves through a new output.
#
# What a user does:
#   1. Opens a project: the track "Oscillator 1" is an open macro holding a folded macro "Macro" (a Filter into a Delay,
#      one input and one output), and a Reverb sits outside it.
#   2. Drags a cable from the outside Reverb's output onto the folded macro's input jack.
#   3. Oscillator 1 now has an input of its own and the cable runs Reverb, Oscillator 1's input, the folded macro's input.
record: true
save_project: macro-input-drop
steps:
