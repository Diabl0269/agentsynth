# FRO2055: icon tiles follow the Depth setting (Flat, Soft, Rich) in the daylight theme.
#
# What a user does: opens a project, then picks Flat, Soft and Rich in Settings > Appearance > Controls > Depth. The top
# bar's chips, the icon buttons on card headers and a toast's disc re-skin at each pick: Flat is a plain tile, Soft is
# today's look, Rich is Soft's tile with a faint ring, top highlight and drop shadow added, and an active tool glows (same shape, size and hue as Soft). Proof marks: check 1,
# the same screen at each level (depth-tiles-daylight-flat, -soft, -rich), each with a toast showing (the timeline's J key, pressed twice so Snap ends as it began) and the top bar's active tools; a close-up of the Compressor card header beside it (depth-header-*).
settings:
  themeId: daylight
  themeMode: Light
steps:
