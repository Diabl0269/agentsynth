# FRO1552: typing into a number field (the sequencer's Steps) shows one focus ring, the field's outer one, and the digits
# and the selected number are the theme's text colour, here in the daylight theme.
#
# What a user does: opens a project with a Sequencer card and double-clicks the Steps number: the field turns into a text
# box with its number selected. Only the outer ring shows (no second ring inside it) and the number reads clearly.
# Proof mark: check 1, the open box with the number selected (daylight-steps-editor-selected).
settings:
  themeId: daylight
  themeMode: Light
motion: true
pop_check: {undo: false}
record: true
save_project: fro1552 number field editor daylight
steps:
  - openProject: {path: "${FIXTURES}/clip-and-sequencer.agsproj"}
  - wait: {}
  - expect: {id: "card:Sequencer > Steps state", value: 8, valueText: "8"}
  - click: {id: "card:Sequencer > Steps", clicks: 2, instant: "the number field turns into a text editor (a text change)"}
  - wait: {}
  - expect: {id: "card:Sequencer > Steps state", editing: true, within_ms: 1000}
  - screenshot: {id: "card:Sequencer > Steps", name: 1-editor-selected, scale: 6}
  - mark: {check: 1, name: daylight-steps-editor-selected}
  - type: {text: "12", instant: "the typed number replaces the selected one (a text change)"}
  - screenshot: {id: "card:Sequencer > Steps", name: 2-editor-typed, scale: 6}
  - key: {keys: return}
  - wait: {}
  - expect: {id: "card:Sequencer > Steps state", value: 12, editing: false}
