name: Build and Release

on:
  # Manual trigger
  workflow_dispatch:
  # Automatic trigger on push to main
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: Linux
            arch: x64
            artifact_name: Gravisynth-Linux-x64

          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            platform: macOS
            arch: arm64
            artifact_name: Gravisynth-macOS-arm64

          # Windows x64
          - os: windows-latest
            platform: Windows
            arch: x64
            artifact_name: Gravisynth-Windows-x64

    steps:
    - uses: actions/checkout@v6

    # Linux Dependencies
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: cmake ninja-build libasound2-dev libx11-dev libxinerama-dev libxext-dev libxcomposite-dev libxcursor-dev libxrandr-dev libxrender-dev libfontconfig1-dev libfreetype6-dev libglu1-mesa-dev libcurl4-openssl-dev libgtk-3-dev libjack-jackd2-dev freeglut3-dev pkg-config
        version: 1.0

    # macOS Dependencies
    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja

    # Windows MSVC environment — required so the Ninja generator can find cl.exe.
    # We use Ninja on every OS so this workflow's build matches the PR CI
    # (ci.yml) exactly. The default Visual Studio generator bakes the VS version
    # into JUCE's cached FetchContent sub-build, which breaks when GitHub bumps
    # the windows-latest image (e.g. VS 2022 -> VS 2026); Ninja's generator
    # string is version-agnostic, so the cache survives image upgrades.
    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # Cache FetchContent Dependencies
    - name: Cache FetchContent Dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        # The "-ninja" tag ties the cache to the generator so the stale
        # Visual-Studio-generator sub-build cache (pinned to an old VS version)
        # is never restored after this workflow switched to Ninja.
        key: ${{ runner.os }}-release-deps-ninja-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-release-deps-ninja-

    # Configure CMake — Ninja on every OS so this matches the PR CI build path
    # (see the "Setup MSVC" note above for why Ninja and not the VS generator).
    - name: Configure CMake
      shell: bash
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    # Build (Ninja is single-config; the build type comes from configure)
    - name: Build
      run: cmake --build build

    # Package Linux
    - name: Package Linux Artifact
      if: runner.os == 'Linux'
      run: |
        mkdir -p artifact
        find build -name Gravisynth -type f -perm /111 -exec cp {} artifact/ \; || true
        if [ ! -f artifact/Gravisynth ]; then
            find build -name Gravisynth -type f -exec cp {} artifact/ \;
        fi
        chmod +x artifact/Gravisynth

    # Package macOS
    - name: Package macOS Artifact
      if: runner.os == 'macOS'
      run: |
        mkdir -p artifact
        APP_PATH=$(find build -name Gravisynth.app -type d -maxdepth 3 | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Gravisynth.app not found!"
          exit 1
        fi
        echo "Found app at: $APP_PATH"

        # Ad-hoc code sign the app bundle
        codesign --force --deep -s - "$APP_PATH"
        codesign --verify --verbose "$APP_PATH"

        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifact/${{ matrix.artifact_name }}.zip

    # Package Windows
    - name: Package Windows Artifact
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        Get-ChildItem -Path build -Recurse -Filter Gravisynth.exe | Copy-Item -Destination artifact\

    # Upload Artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: artifact/
        retention-days: 90

  release:
    name: Tag and Release
    needs: [build]
    # Only tag + release on push to main. workflow_dispatch is therefore a
    # build-only dry-run, safe to trigger on a branch to validate the matrix
    # (incl. the Windows build) before merging.
    if: always() && !contains(needs.build.result, 'failure') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          tag_prefix: "v"
          fetch_all_tags: true

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: artifacts/*
          draft: false
          prerelease: true
