name: Build and Release

on:
  # Manual trigger
  workflow_dispatch:
  # Automatic trigger on push to main
  push:
    branches: [ "main" ]
    # Docs-only / non-code merges don't ship a new binary, so skip the whole
    # build + tag + release workflow (including the automatic version bump) when
    # a push touches ONLY these paths. A push that also changes code/CMake/
    # workflows still builds and releases as before. workflow_dispatch is
    # unaffected (it has no paths filter — manual dry-run still works).
    paths-ignore:
      - '**/*.md'              # README, CLAUDE.md, GEMINI.md, docs/*.md, …
      - 'docs/**'              # non-markdown docs assets
      - 'LICENSE'
      - '.gitignore'
      - '.clang-format'
      - '.clang-format-version'
      - '.claude/**'
      - 'mockups/**'

permissions:
  contents: write

# Releases are tagged from main, so runs must not race each other or two pushes land on the same
# tag. Never cancel: a cancelled run leaves a version bump without its artifacts.
concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # CCACHE_DIR is pinned per platform rather than left to ccache's default, which varies by OS
    # AND by ccache version — a path that disagrees with the actions/cache `path:` means the cache
    # silently never saves (that is exactly how ci.yml's Linux ccache went missing entirely).
    # It is a matrix value because this is one job spanning three runners, so a job-level override
    # is not available. Windows uses a forward-slash absolute path: `github.workspace` there is a
    # backslash path, and backslashes survive as literals inside a quoted bash string, breaking
    # `mkdir -p`.
    env:
      CCACHE_DIR: ${{ matrix.ccache_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: Linux
            arch: x64
            artifact_name: AgentSynth-Linux-x64
            ccache_dir: /home/runner/.ccache

          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            platform: macOS
            arch: arm64
            artifact_name: AgentSynth-macOS-arm64
            ccache_dir: /Users/runner/.ccache

          # Windows x64
          - os: windows-latest
            platform: Windows
            arch: x64
            artifact_name: AgentSynth-Windows-x64
            ccache_dir: C:/Users/runneradmin/AppData/Local/ccache

    steps:
    - uses: actions/checkout@v6

    # Linux Dependencies
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: cmake ninja-build ccache libasound2-dev libx11-dev libxinerama-dev libxext-dev libxcomposite-dev libxcursor-dev libxrandr-dev libxrender-dev libfontconfig1-dev libfreetype6-dev libglu1-mesa-dev libcurl4-openssl-dev libgtk-3-dev libjack-jackd2-dev freeglut3-dev pkg-config
        version: 1.1

    # macOS Dependencies
    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja ccache

    # Windows MSVC environment — required so the Ninja generator can find cl.exe.
    # We use Ninja on every OS so this workflow's build matches the PR CI
    # (ci.yml) exactly. The default Visual Studio generator bakes the VS version
    # into JUCE's cached FetchContent sub-build, which breaks when GitHub bumps
    # the windows-latest image (e.g. VS 2022 -> VS 2026); Ninja's generator
    # string is version-agnostic, so the cache survives image upgrades.
    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # Cache FetchContent Dependencies
    # restore + save are split (rather than the combined actions/cache) so the health check below
    # can read `cache-matched-key`, which the combined action does not expose — see
    # docs/testing.md "Build caching", rule 4.
    - name: Restore FetchContent Dependencies
      id: deps-cache
      uses: actions/cache/restore@v5
      with:
        path: build/_deps
        # The "-ninja" tag ties the cache to the generator so the stale
        # Visual-Studio-generator sub-build cache (pinned to an old VS version)
        # is never restored after this workflow switched to Ninja.
        #
        # Keyed on cmake/DependencyVersions.cmake — the dependency pins — and NOT on
        # CMakeLists.txt. build/_deps contains only the fetched JUCE + googletest sources, so a
        # module adding a source line must not invalidate a ~360 MB entry. Under the old
        # CMakeLists-wide key this workflow minted 3 fresh entries (~1.1 GB) on every merge that
        # touched CMakeLists.txt, which together with ci.yml's copies pushed the repo past
        # GitHub's 10 GB cache budget and LRU-evicted the ccache entries. The "3" is a one-time
        # bump to orphan the old, wrongly-keyed entries.
        key: ${{ runner.os }}-release-deps-ninja3-${{ hashFiles('cmake/DependencyVersions.cmake') }}
        restore-keys: |
          ${{ runner.os }}-release-deps-ninja3-

    # ccache. This workflow had none until Aug 2026, so every release build recompiled the whole
    # tree from cold even though ci.yml had just built the identical commit. The key is scoped
    # `-release-` because this is a different build than the PR CI one (Release, no tests, no
    # coverage) and its objects must not be confused with ci.yml's.
    - name: Restore ccache
      id: ccache-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-release-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-release-ccache-

    - name: Configure ccache
      shell: bash
      run: |
        mkdir -p "$CCACHE_DIR"
        ccache --set-config=max_size=2G
        # See ci.yml for why these two are needed: checkout rewrites every file's mtime on each
        # run, and the compiler binary's mtime changes when GitHub rebuilds the runner image.
        ccache --set-config=compiler_check=content
        ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
        ccache --zero-stats

    # Configure CMake — Ninja on every OS so this matches the PR CI build path
    # (see the "Setup MSVC" note above for why Ninja and not the VS generator).
    # SYNTH_BUILD_NUMBER becomes CFBundleVersion, the value Sparkle actually compares to decide
    # an update is available (see CMakeLists.txt's comment on SYNTH_BUILD_NUMBER for why this
    # can't just be the project's marketing VERSION: that's hand-bumped in CMakeLists.txt, while
    # this workflow's tag-and-release step below bumps semver tags independently). run_number is
    # known before this step runs and increases every run, so it stays correct regardless of what
    # tag the release job mints afterwards. SYNTH_SPARKLE_PUBLIC_KEY reads from a repo VARIABLE
    # (not a secret — SUPublicEDKey is the public half of the key pair) that doesn't exist yet; see
    # docs/distribution.md. Both are harmless no-ops on Linux/Windows, where SYNTH_SPARKLE_* is
    # unused.
    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DSYNTH_BUILD_NUMBER=${{ github.run_number }} \
          -DSYNTH_SPARKLE_PUBLIC_KEY="${{ vars.SPARKLE_PUBLIC_KEY }}"

    # Build (Ninja is single-config; the build type comes from configure)
    - name: Build
      run: cmake --build build

    # Report-only: a cold cache must never block a release. CACHE_WARM_EXPECTED is pinned false
    # so the check writes its summary table and annotates, but cannot fail the job — losing a
    # release over a cache miss would be a far worse outcome than a slow release.
    - name: Check Cache Health
      if: always()
      shell: bash
      env:
        CACHE_MATCHED_KEY: ${{ steps.ccache-cache.outputs.cache-matched-key }}
        DEPS_MATCHED_KEY: ${{ steps.deps-cache.outputs.cache-matched-key }}
        CACHE_WARM_EXPECTED: 'false'
        CACHE_CHECK_ENFORCE: 'false'
      run: bash scripts/ci-cache-check.sh

    - name: Save FetchContent Dependencies
      if: always() && steps.deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: build/_deps
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

    # Package Linux
    - name: Package Linux Artifact
      if: runner.os == 'Linux'
      run: |
        mkdir -p artifact
        find build -name "Agent Synth" -type f -perm /111 -exec cp {} artifact/ \; || true
        if [ ! -f "artifact/Agent Synth" ]; then
            find build -name "Agent Synth" -type f -exec cp {} artifact/ \;
        fi
        chmod +x "artifact/Agent Synth"

        # AgentSynthPlugin_VST3's .vst3 is a directory bundle on Linux, and
        # softprops/action-gh-release (in the release job below) uploads `artifact/*` as release
        # assets — GitHub release assets must be files, so the bundle is zipped rather than
        # copied in raw. `zip -r` from inside the bundle's parent dir preserves its internal
        # structure. find (not a hardcoded path) so a JUCE artefact-path change fails loudly here
        # instead of silently shipping an artifact/ with no plugin in it.
        VST3_PATH=$(find build -name "Agent Synth.vst3" -type d | head -n 1)
        if [ -z "$VST3_PATH" ]; then
          echo "Agent Synth.vst3 not found!"
          exit 1
        fi
        VST3_DIR=$(dirname "$VST3_PATH")
        VST3_NAME=$(basename "$VST3_PATH")
        ARTIFACT_DIR="$(pwd)/artifact"
        (cd "$VST3_DIR" && zip -r "$ARTIFACT_DIR/${{ matrix.artifact_name }}-Plugins.zip" "$VST3_NAME")
        if [ ! -s "artifact/${{ matrix.artifact_name }}-Plugins.zip" ]; then
          echo "Failed to create plugin zip!"
          exit 1
        fi

    # Package macOS
    - name: Package macOS Artifact
      if: runner.os == 'macOS'
      run: |
        mkdir -p artifact
        APP_PATH=$(find build -name "Agent Synth.app" -type d -maxdepth 3 | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Agent Synth.app not found!"
          exit 1
        fi
        echo "Found app at: $APP_PATH"

        # Ad-hoc code sign the app bundle
        codesign --force --deep -s - "$APP_PATH"
        codesign --verify --verbose "$APP_PATH"

        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifact/${{ matrix.artifact_name }}.zip

        # Plugins (AgentSynthPlugin_VST3 / AgentSynthPlugin_AU) ship as their own zip, separate
        # from the app above, so a plugin-only user isn't forced to also download the standalone
        # app. find (not a hardcoded path) so a JUCE artefact-path change fails loudly here
        # instead of silently shipping a zip with no plugin in it.
        VST3_PATH=$(find build -name "Agent Synth.vst3" -type d | head -n 1)
        if [ -z "$VST3_PATH" ]; then
          echo "Agent Synth.vst3 not found!"
          exit 1
        fi
        echo "Found VST3 at: $VST3_PATH"

        AU_PATH=$(find build -name "Agent Synth.component" -type d | head -n 1)
        if [ -z "$AU_PATH" ]; then
          echo "Agent Synth.component not found!"
          exit 1
        fi
        echo "Found AU at: $AU_PATH"

        # Stage both bundles into one directory and archive THAT. `ditto -c -k` takes exactly one
        # source ("ditto: Can't archive multiple sources"), so the two bundles cannot be passed
        # side by side. Archiving the staging dir WITHOUT --keepParent puts its contents at the
        # zip root, so extracting yields "Agent Synth.vst3" and "Agent Synth.component" next to
        # each other rather than nested under a wrapper folder.
        PLUGIN_STAGE="$RUNNER_TEMP/plugin-stage"
        rm -rf "$PLUGIN_STAGE"
        mkdir -p "$PLUGIN_STAGE"
        cp -R "$VST3_PATH" "$PLUGIN_STAGE/"
        cp -R "$AU_PATH" "$PLUGIN_STAGE/"

        # Sign the staged COPIES — these are what ends up in the zip. cp -R preserves the bundle
        # layout, and signing after the copy guarantees the shipped bundles carry the signature.
        codesign --force --deep -s - "$PLUGIN_STAGE/$(basename "$VST3_PATH")"
        codesign --verify --verbose "$PLUGIN_STAGE/$(basename "$VST3_PATH")"
        codesign --force --deep -s - "$PLUGIN_STAGE/$(basename "$AU_PATH")"
        codesign --verify --verbose "$PLUGIN_STAGE/$(basename "$AU_PATH")"

        ditto -c -k --sequesterRsrc "$PLUGIN_STAGE" artifact/${{ matrix.artifact_name }}-Plugins.zip

        if [ ! -s "artifact/${{ matrix.artifact_name }}-Plugins.zip" ]; then
          echo "Failed to create plugin zip!"
          exit 1
        fi

    # Package Windows
    - name: Package Windows Artifact
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        Get-ChildItem -Path build -Recurse -Filter "Agent Synth.exe" | Copy-Item -Destination artifact\

        # AgentSynthPlugin_VST3's .vst3 is a directory bundle on Windows too (it contains
        # Contents\x86_64-win\Agent Synth.vst3 internally), and softprops/action-gh-release (in
        # the release job below) uploads `artifact/*` as release assets — GitHub release assets
        # must be files, so the bundle is zipped rather than copied in raw. Passing the bundle
        # DIRECTORY itself to Compress-Archive (no trailing \*) keeps the bundle folder as the
        # archive root, preserving its internal structure. Get-ChildItem -Recurse
        # (not a hardcoded path) so a JUCE artefact-path change fails loudly here instead of
        # silently shipping an artifact\ with no plugin in it.
        $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "Agent Synth.vst3" | Select-Object -First 1
        if (-not $vst3) {
          Write-Error "Agent Synth.vst3 not found!"
          exit 1
        }
        $pluginZip = "artifact\${{ matrix.artifact_name }}-Plugins.zip"
        Compress-Archive -Path $vst3.FullName -DestinationPath $pluginZip
        if (-not (Test-Path $pluginZip) -or (Get-Item $pluginZip).Length -eq 0) {
          Write-Error "Failed to create plugin zip!"
          exit 1
        }

    # Upload Artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: artifact/
        retention-days: 90

  release:
    name: Tag and Release
    needs: [build]
    # Only tag + release on push to main. workflow_dispatch is therefore a
    # build-only dry-run, safe to trigger on a branch to validate the matrix
    # (incl. the Windows build) before merging.
    if: always() && !contains(needs.build.result, 'failure') && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          tag_prefix: "v"
          fetch_all_tags: true

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: artifacts/*
          draft: false
          prerelease: true

  publish-appcast:
    name: Publish Sparkle appcast
    needs: [release]
    # Skips cleanly (not a failure) until both halves of the EdDSA signing key exist: the public
    # key as a repo VARIABLE (embedded into the app's Info.plist by the build job above) and the
    # private key as this job's SPARKLE_PRIVATE_KEY secret. See docs/distribution.md for how to
    # generate both with Sparkle's own `generate_keys` tool. Until then, "Check for Updates" in the
    # app itself also stays inert (UpdateManager checks for a non-empty SUPublicEDKey at startup).
    if: needs.release.result == 'success' && vars.SPARKLE_PUBLIC_KEY != ''
    runs-on: macos-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: AgentSynth-macOS-arm64
          path: appcast-work

      # Version pin duplicated from cmake/DependencyVersions.cmake's SYNTH_SPARKLE_URL/
      # SYNTH_SPARKLE_SHA256 — this job runs standalone (no CMake configure), so it re-fetches the
      # same release directly rather than parsing the .cmake file. Keep both in sync when bumping.
      - name: Fetch Sparkle tools
        run: |
          curl -sL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz
          echo "015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools

      # --download-url-prefix points at this same release's GitHub asset URLs, so only this small
      # appcast.xml file needs hosting on agentsynth.app — the zip itself stays on GitHub Releases.
      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | ./sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag }}/" \
            -o appcast.xml \
            appcast-work/

      # Attaches appcast.xml to the release as a downloadable/inspectable asset. This is NOT the
      # same as deploying it to https://agentsynth.app/updates/appcast.xml (the app's SUFeedURL) —
      # that publish step still needs to be wired up separately (marketing site / Cloudflare), see
      # docs/distribution.md's "what's not automated yet".
      - name: Attach appcast to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release.outputs.tag }} appcast.xml --clobber --repo ${{ github.repository }}
