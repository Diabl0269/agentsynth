name: CI Passthrough

# WHY THIS EXISTS: `main`'s branch protection requires four ci.yml contexts (`Lint`,
# `Build, Test, and Coverage`, `Build and Test (macOS)`, `Build and Test (Windows)` — see
# docs/development/ci-pipeline.md and .github/CLAUDE.md). ci.yml's own `pull_request`
# trigger is `paths:`-filtered to Source/**, Tests/**, Tools/**, the CMake files, scripts/**,
# .clang-format*, and its own two workflow files — deliberately, so a docs-only PR doesn't pay
# for a full build matrix. But GitHub's required-status-check gate doesn't know "not
# applicable" from "still running": a required context that never posts any status stays
# "Expected — waiting for status to be reported" forever, so a docs-only PR shows BLOCKED even
# though every check that actually ran (Docs, PR Title) is green. Before this file existed the
# routine workaround was `gh pr merge --admin`, which bypasses ALL required checks, including a
# red Docs job — see docs/development/docs-guard.md. This workflow closes that hole: whenever
# ci.yml's own trigger paths don't match, this one does, and posts an immediate success under
# each of the four job names ci.yml would have used, so the PR becomes normally mergeable.
#
# `paths-ignore:` below is a byte-for-byte copy of ci.yml's `pull_request.paths:` list — the
# complement of a `paths:` filter's "any changed file matches" is exactly a `paths-ignore:`
# filter's "not every changed file matches", so together the two workflows are mutually
# exclusive on a single-concern PR (either ci.yml runs and this doesn't, or vice versa). ci.yml
# names this file in its own "keep the lists in sync" NOTE — this is now the THIRD copy of that
# path list (pull_request, push, and this file); if you touch one, touch all three, and add the
# new path to ci.yml's `paths:` too if it should trigger a real build.
#
# KNOWN HAZARD (confirmed live on PR #420, 2026-09-18): a mixed PR (e.g. one commit touching
# both Source/** and docs/**) matches ci.yml's `paths:` filter (so ci.yml runs) but does NOT
# match every entry in this file's `paths-ignore:` list either (docs/** isn't ignored here), so
# both workflows fire and both post a status under the same job name (e.g. two "Lint" check runs
# on the same commit) -- and mixed PRs are the norm here, not an edge case, since this repo's own
# convention requires updating docs/ in the same PR as the behavior change. DO NOT "fix" this by
# adding docs/**, *.md, etc. to the `paths-ignore:` list below -- that makes a PURE docs-only
# PR's own changed file match an ignore pattern too, so ALL its changed files would match and
# this workflow would stop firing exactly for the case FRO170 exists to cover, reintroducing the
# original BLOCKED-forever bug. GitHub's `paths:` filter is an existential match (any file
# triggers) and `paths-ignore:` is a universal one (skip only if every file matches) -- these two
# quantifiers can't be made to partition an arbitrary mixed changeset with simple prefix lists,
# so true mutual exclusivity isn't reachable this way at all; only a single-workflow job-level
# `if:` refactor of ci.yml (dropping its `paths:` filter for a `changes`-job gate) would fully
# eliminate the duplicate runs, and that's a bigger, riskier change to a load-bearing file not
# currently justified (see below for why the duplication isn't actually dangerous).
#
# VERIFIED SAFE, not just "in practice": checked live on PR #420 while the real ci.yml jobs were
# still `IN_PROGRESS` and only this workflow's synthetic successes had posted -- `mergeStateStatus`
# already read `BLOCKED`, not `CLEAN`. Branch protection does not consider a required context
# satisfied while ANY run under that context name is non-terminal, regardless of what an earlier
# duplicate run under the same name already posted; it isn't "whichever run completes last wins",
# it's "not satisfied until every run for that context is terminal, and none of them failed". So
# GitHub's actual merge gate (what "Merge pull request" and native auto-merge both consult) is
# never fooled by this duplication, in either direction. The real, narrower hazard is cosmetic:
# `gh pr checks` and any hand-rolled tooling that reads conclusion=="success" for a context name
# without checking status=="completed" for every run under that name could be misled during the
# window before the real jobs finish. Prefer `mergeStateStatus`/`mergeable` (or `gh pr merge`
# itself, which respects them) over a raw `gh pr checks` reading for any automation that decides
# whether to act on a PR's checks.

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]
    # NOTE: keep verbatim in sync with ci.yml's `pull_request.paths:` list (see header above).
    paths-ignore:
      - 'Source/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'CMakeLists.txt'
      - 'Tests/CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - '.clang-format'
      - '.clang-format-version'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-artifacts.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change — ci.yml's Lint job doesn't apply; docs.yml's Docs job covers this PR instead."

  build-and-test:
    name: "Build, Test, and Coverage"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change — no build/test/coverage applies."

  build-and-test-macos:
    name: "Build and Test (macOS)"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change — no build/test/coverage applies."

  build-and-test-windows:
    name: "Build and Test (Windows)"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change — no build/test/coverage applies."
