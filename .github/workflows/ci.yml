name: Agent Synth CI

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'Tests/CMakeLists.txt'
      - 'scripts/**'
      - '.clang-format'
      - '.clang-format-version'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-artifacts.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install pinned clang-format
      # Pinned via the PyPI clang-format wheel (the real LLVM binary) so CI and
      # the local git hooks run the EXACT same version — no more "passes locally,
      # fails in CI" drift from an unpinned apt package. Single source of truth:
      # .clang-format-version
      run: pip install "clang-format==$(cat .clang-format-version)"
    - name: Check Formatting
      run: find Source Tests -name "*.h" -o -name "*.cpp" | xargs clang-format --dry-run --Werror

  build-and-test:
    name: Build, Test, and Coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libasound2-dev libx11-dev libxinerama-dev libxext-dev libxcomposite-dev libxcursor-dev libxrandr-dev libxrender-dev libfontconfig1-dev libfreetype6-dev libglu1-mesa-dev libcurl4-openssl-dev libgtk-3-dev libjack-jackd2-dev freeglut3-dev pkg-config llvm clang ccache xvfb

    - name: Cache FetchContent Dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        # The "2" bump invalidates caches saved before the repo was renamed
        # gravisynth -> agentsynth: their FetchContent subbuild dirs have the
        # old .../work/gravisynth/gravisynth absolute path baked in, which
        # conflicts with the new .../work/agentsynth/agentsynth checkout path
        # and trips CMake's directory-mismatch guard.
        key: ${{ runner.os }}-deps2-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps2-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure ccache
      run: |
        ccache --set-config=max_size=500M
        ccache --zero-stats

    - name: Configure CMake
      run: |
        # Use clang for consistent coverage flags
        export CC=clang
        export CXX=clang++
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON \
          -DENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build

    - name: ccache Stats
      run: ccache --show-stats

    - name: Run Tests
      timeout-minutes: 10
      run: |
        export LLVM_PROFILE_FILE="default.profraw"
        # Run without xvfb — tests are headless and xvfb's X11 event loop
        # adds ~44s overhead per pumpMessages() call on slow CI runners
        ./build/Tests/Tests

    - name: Check Coverage
      run: xvfb-run bash scripts/coverage.sh --report-only

    - name: Upload Coverage Artifact (Optional)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          default.profdata
          default.profraw

  build-and-test-asan:
    name: Build and Test (ASAN)
    if: contains(github.event.pull_request.labels.*.name, 'run-asan')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: cmake ninja-build libasound2-dev libx11-dev libxinerama-dev libxext-dev libxcomposite-dev libxcursor-dev libxrandr-dev libxrender-dev libfontconfig1-dev libfreetype6-dev libglu1-mesa-dev libcurl4-openssl-dev libgtk-3-dev libjack-jackd2-dev freeglut3-dev pkg-config clang xvfb
        version: 1.0

    - name: Cache FetchContent Dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        # The "2" bump invalidates caches saved before the repo was renamed
        # gravisynth -> agentsynth: their FetchContent subbuild dirs have the
        # old .../work/gravisynth/gravisynth absolute path baked in, which
        # conflicts with the new .../work/agentsynth/agentsynth checkout path
        # and trips CMake's directory-mismatch guard.
        key: ${{ runner.os }}-deps2-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps2-

    - name: Configure CMake
      run: |
        export CC=clang
        export CXX=clang++
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_TESTS=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

    - name: Build
      run: cmake --build build --target Tests

    - name: Run Tests
      run: xvfb-run ./build/Tests/Tests
      env:
        ASAN_OPTIONS: detect_leaks=0

  build-and-test-macos:
    name: Build and Test (macOS)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: brew install cmake ninja ccache

    - name: Cache FetchContent Dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        # The "2" bump invalidates caches saved before the repo was renamed
        # gravisynth -> agentsynth: their FetchContent subbuild dirs have the
        # old .../work/gravisynth/gravisynth absolute path baked in, which
        # conflicts with the new .../work/agentsynth/agentsynth checkout path
        # and trips CMake's directory-mismatch guard.
        key: ${{ runner.os }}-deps2-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps2-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure ccache
      run: |
        ccache --set-config=max_size=500M
        ccache --zero-stats

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build

    - name: ccache Stats
      run: ccache --show-stats

    - name: Run Tests
      working-directory: ./build/Tests
      run: ./Tests

  build-and-test-windows:
    name: Build and Test (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Cache FetchContent Dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        # The "2" bump invalidates caches saved before the repo was renamed
        # gravisynth -> agentsynth: their FetchContent subbuild dirs have the
        # old .../work/gravisynth/gravisynth absolute path baked in, which
        # conflicts with the new .../work/agentsynth/agentsynth checkout path
        # and trips CMake's directory-mismatch guard.
        key: ${{ runner.os }}-deps2-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps2-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: C:\Users\runneradmin\AppData\Local\ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure ccache
      shell: bash
      run: |
        mkdir -p C:/Users/runneradmin/AppData/Local/ccache
        ccache --set-config=max_size=500M
        ccache --zero-stats
      env:
        CCACHE_DIR: C:/Users/runneradmin/AppData/Local/ccache

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      env:
        CCACHE_DIR: C:/Users/runneradmin/AppData/Local/ccache

    - name: Build
      run: cmake --build build --config Release

    - name: ccache Stats
      shell: bash
      run: ccache --show-stats
      env:
        CCACHE_DIR: C:/Users/runneradmin/AppData/Local/ccache

    - name: Run Tests
      shell: bash
      run: |
        find build -name "Tests.exe" -exec {} \;
