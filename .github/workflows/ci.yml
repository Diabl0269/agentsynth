name: Agent Synth CI

on:
  # Manual re-seeding run. PR runs restore caches only and never save (see the cache-save `if:`
  # conditions below) so a PR can never re-populate main's caches after they're evicted or
  # 7-day-GC'd. Before that change a failed PR attempt would leave behind a PR-scoped cache and a
  # rerun would restore it, so main being cold was self-healing; now the only way to reseed is a
  # push to main (which needs a real commit) or this manual trigger. It is build-only on any ref:
  # `lint`/`Run Tests`/`Check Coverage` all gate on `github.event_name == 'pull_request'`, and
  # `CACHE_WARM_EXPECTED` below evaluates false for workflow_dispatch, so a cold cache here is
  # reported as expected, not a failure.
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]
    # NOTE: GitHub Actions does not support YAML anchors, so this list is duplicated verbatim
    # under `push:` below, AND (inverted, as `paths-ignore:`) in ci-passthrough.yml, which posts
    # a synthetic success under each of this workflow's three required job names when a PR's
    # changes don't match this filter (FRO170 — see that file's header for why). Keep all three
    # in sync.
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'CMakeLists.txt'
      - 'Tests/CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - '.clang-format'
      - '.clang-format-version'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-artifacts.yml'
  # Seeding runs. GitHub scopes every cache to the ref that wrote it: a pull-request run can read
  # caches from its own ref and from the BASE branch, and nowhere else. While this workflow ran on
  # `pull_request` alone it never wrote a cache into main's scope, so no PR could ever restore one
  # and every run compiled the whole tree cold — for the entire life of the ccache setup. These
  # push runs exist to populate the main-scoped caches that pull requests restore from.
  push:
    branches: [ "main" ]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'CMakeLists.txt'
      - 'Tests/CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - '.clang-format'
      - '.clang-format-version'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-artifacts.yml'

# One run per PR. Pushing three times in five minutes used to leave three full matrices racing
# (feature/theme-additions ran 4x in one hour on 2026-08-06), which burned runner minutes and
# minted redundant cache entries that pushed the repo over GitHub's 10 GB cache budget. Main is
# never cancelled — those runs are what seed the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ccache's default cache directory differs per platform AND per ccache version, and the
  # actions/cache `path:` has to match it exactly or the cache silently never saves. The Linux job
  # cached ~/.ccache while ccache 4.x on ubuntu-24.04 writes to ~/.cache/ccache, so no
  # Linux-ccache-* entry was ever produced — verifiable via
  # `gh api repos/:owner/:repo/actions/caches`. Pinning CCACHE_DIR explicitly removes the guess.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # `true` only when a warm cache must already exist, so that a miss is a real failure:
  #   - pull_request from a branch in THIS repo — restores the cache seeded by the push run on main
  #   - push to main                            — that IS the seeding run, a miss is expected
  #   - pull_request from a FORK                — forks are given a separate, isolated cache scope
  #     and cannot read the base repository's entries at all, so a miss is guaranteed and is not a
  #     defect. Without this term, enabling CI_CACHE_CHECK_ENFORCE would fail every outside
  #     contribution on its first run, for a reason the contributor could do nothing about.
  CACHE_WARM_EXPECTED: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
  # Set the repository variable CI_CACHE_CHECK_ENFORCE to 'true' to make a cold cache fail the
  # build (it is currently 'true'). Kept behind a variable so enforcement can be switched off
  # without a code change if a runner-image or actions/cache change starts producing false alarms —
  # Settings > Secrets and variables > Actions > Variables.
  CACHE_CHECK_ENFORCE: ${{ vars.CI_CACHE_CHECK_ENFORCE || 'false' }}

jobs:
  # On push to main the jobs below exist ONLY to seed the caches that pull requests restore from,
  # so everything that is not compilation is skipped there: linting, test execution and coverage
  # all ran on the pull request against this same tree, and re-running them on the merge result
  # costs runner minutes without adding signal. `build-artifacts.yml` has always taken this
  # position for the release build ("no tests — CI already ran them on the PR").
  #
  # Crucially this does NOT weaken the cache: `cmake --build build` still compiles the Tests
  # target, so every test translation unit lands in ccache either way. Only *running* the binary
  # is skipped. Before this, a push run spent 9.4 runner-minutes; roughly a third of that was
  # redundant — the macOS job in particular was an 8-second build carrying 118 seconds of tests.
  lint:
    name: Lint
    # Formatting cannot change between the PR run and the merge commit, and this job also carries
    # the cache-check unit tests, which are equally a PR-time concern.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # FRO220/FRO221: the runner image's default locale is UTF-8, under which awk aborts on the
      # first non-ASCII byte it meets (an em dash in a comment) and a text-scanning guard silently
      # examines a fraction of the tree while still exiting 0 -- check-function-sizes.sh scanned
      # 45 percent of it that way for three days. The affected scripts now export LC_ALL=C
      # themselves; this pins the whole job so a guard added later cannot inherit the image's
      # locale by accident. C, not C.UTF-8: the guards' regexes are written for byte semantics.
      LC_ALL: C
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install pinned clang-format
      # Pinned via the PyPI clang-format wheel (the real LLVM binary) so CI and
      # the local git hooks run the EXACT same version — no more "passes locally,
      # fails in CI" drift from an unpinned apt package. Single source of truth:
      # .clang-format-version
      run: pip install "clang-format==$(cat .clang-format-version)"
    - name: Check Formatting
      run: find Source Tests Tools -name "*.h" -o -name "*.cpp" | xargs clang-format --dry-run --Werror
    - name: Test CI cache check
      # The cache check is what tells us the build cache broke; if it breaks silently we are back
      # to shipping 100%-cold builds unnoticed. Cheap (~1s, no compiler) so it rides along here.
      run: bash scripts/tests/ci-cache-check.test.sh
    - name: Test Linux dependency install
      # Covers the apt mirror-failover path, which by definition only runs during an outage — the
      # one that burned six hours of runner time on 2026-08-18. Same deal: ~1s, no apt, no network.
      run: bash scripts/tests/ci-install-linux-deps.test.sh
    - name: Test Windows NSIS install
      # FRO104: build-artifacts.yml's Windows leg installs NSIS through scripts/ci-install-nsis.sh
      # (choco retries, then a checksum-pinned direct download). Its outage path only ever runs
      # during a Chocolatey outage, so it is exercised here against a fake choco. ~2s, no network.
      run: bash scripts/tests/ci-install-nsis.test.sh
    - name: Check string literals are ASCII-safe
      # juce::String decodes a `const char*` as Latin-1, so a non-ASCII literal ships as mojibake
      # ("Rename…" rendered "Renameâ€¦"). A compiler cannot catch it and no test asserted on it.
      # Same deal as the two above: ~1s, no compiler.
      run: bash scripts/tests/check-nonascii-literals.test.sh
    - name: Test AI eval ratchet
      # Guards the nightly/manual AIPatchHarness ratchet (P1-11), which never runs here itself
      # (needs a live model) but is cheap and deterministic to unit test. ~1s, no model, no network.
      run: bash scripts/tests/ai-eval-ratchet.test.sh
    - name: Test UTF-8 literal check
      run: bash scripts/tests/utf8-literal-check.test.sh
    - name: Test dev-sign-app
      # scripts/dev-sign-app.sh itself only ever does anything on a macOS runner with an Apple
      # Development identity installed (neither is true here), but its identity-selection logic
      # is still worth testing -- via fake uname/security/codesign shims -- on every platform.
      run: bash scripts/tests/dev-sign-app.test.sh
    - name: Test ci-local worktree dependency-source reuse
      # FRO92: scripts/ci-local.sh's first-configure-in-a-worktree FetchContent reuse
      # (scripts/lib/deps-reuse.sh) is only ever exercised locally otherwise -- this runs the
      # reuse/no-reuse decision against fixture directory trees, no cmake or compiler involved.
      run: bash scripts/tests/ci-local-deps-reuse.test.sh
    - name: Test ci-local shared test lock
      # FRO192: scripts/ci-local.sh serialises its test run behind a lock shared by every worktree
      # (scripts/lib/test-lock.sh) so two local suites cannot collide through the shared settings
      # file. Only ever exercised locally otherwise -- this checks the lock path, serialisation,
      # timeout status and exit-code passthrough with shell stand-ins, no compiler. A few seconds.
      run: bash scripts/tests/ci-local-test-lock.test.sh
    - name: Check for un-decoded UTF-8 escapes
      # juce::String(const char*) decodes as ASCII, not UTF-8 -- a "\xe2\x80\x94"-style escape
      # passed straight to a String-taking API silently renders as mojibake (P6-16, 2026-08-26).
      # See scripts/utf8-literal-check.sh's own doc comment for the full story.
      run: bash scripts/utf8-literal-check.sh
    - name: Test file-size guard
      # If the guard that stops the next GraphEditor.cpp (9,000+ lines) has a hole -- a mis-scanned
      # exclusion, a ratchet that doesn't actually ratchet -- the cap is decorative. ~1s, no compiler.
      run: bash scripts/tests/check-file-sizes.test.sh
    - name: Check file sizes
      # FRO61: hard 1000-line cap + strict ratchet baseline (scripts/file-size-baseline.txt) for
      # legacy files already over it. See scripts/check-file-sizes.sh's own doc comment and
      # docs/development/file-size-guard.md for the full mechanism.
      run: bash scripts/check-file-sizes.sh
    - name: Check docs integrity
      # FRO169: runs scripts/check-docs.sh against the REAL tree, not just its unit test -- a PR
      # that only edits a Source/*.h comment (in scope for check C/D, but never under docs/**)
      # needs docs-integrity signal too, and this job's own `paths:` filter would let such a PR
      # through untouched otherwise. See scripts/check-docs.sh's own doc comment and
      # docs/development/docs-guard.md for the full mechanism.
      run: bash scripts/check-docs.sh
    - name: Test function-size guard
      # Same story as the file-size guard's own test above, one level down: a hole in the scanner
      # that measures individual FUNCTIONS (a mis-scanned comment/string, a brace-depth bug) makes
      # the 200-line function cap decorative. ~10s (real C++ parsing, not just `wc -l`), no compiler.
      run: bash scripts/tests/check-function-sizes.test.sh
    - name: Check function sizes
      # FRO78: hard 200-line cap per function + strict ratchet baseline
      # (scripts/function-size-baseline.txt) for legacy functions already over it. See
      # scripts/check-function-sizes.sh's own doc comment and docs/development/function-size-guard.md
      # for the full mechanism.
      run: bash scripts/check-function-sizes.sh
    - name: Test header-comment-placement guard
      # A hole in the scanner that measures comment PLACEMENT (a wrong floor/ratio, a sibling-.cpp
      # check that always/never matches, a ratchet that doesn't actually ratchet) makes the
      # placement rule decorative. ~1s, no compiler, no network.
      run: bash scripts/tests/check-header-comments.test.sh
    - name: Check header comment placement
      # FRO183: a shared header carries declarations + short caller-facing constraints; the
      # maintainer-facing rationale for a member lives beside its out-of-line definition in the
      # owning .cpp unit, not the header. Hard threshold (positive excess = comments minus code,
      # floor 60, has a sibling .cpp) + strict ratchet baseline (scripts/header-comment-baseline.txt)
      # for headers already over it -- tracking excess (not a raw comment count) so adding a member
      # with its own one-line caller contract never trips the ratchet. See
      # scripts/check-header-comments.sh's own doc comment and docs/development/header-comment-guard.md "Header comment
      # placement" for the full mechanism.
      run: bash scripts/check-header-comments.sh
    - name: Test docs checker
      # A hole in the docs-integrity scanner (a mis-scanned exclusion, a regex that matches the
      # wrong `]`, a ratchet that doesn't actually ratchet) makes the link/section/naming/map
      # checks decorative. ~1s, no compiler, no network. See scripts/check-docs.sh's own doc
      # comment; "Check docs integrity" above runs the checker itself against the real tree.
      run: bash scripts/tests/check-docs.test.sh

  build-and-test:
    name: Build, Test, and Coverage
    runs-on: ubuntu-latest
    # actions: write is only for the main-only "Prune superseded main cache generations" step
    # below (gh cache delete needs it); contents: read replaces what an unset permissions block
    # would otherwise grant by default, since declaring any permissions here narrows every other
    # scope to none.
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v6

    # The package list and the mirror-failover logic live in the script, which has tests
    # (scripts/tests/ci-install-linux-deps.test.sh, run by the Lint job). timeout-minutes is the
    # backstop, not the mechanism: the script itself caps each apt call so it can *recover* from a
    # sick mirror, while this ceiling exists because a bare `apt-get` has none — on 2026-08-18 one
    # run sat in this step for six hours before anyone noticed.
    - name: Install Dependencies
      timeout-minutes: 15
      run: bash scripts/ci-install-linux-deps.sh

    # NOTE: restore + save are split deliberately. The combined `actions/cache` action declares
    # exactly ONE output, `cache-hit` (true only on an exact primary-key match); only
    # `actions/cache/restore` exposes `cache-matched-key`, which is the one signal that reports
    # whether a restore-key fallback matched. The health check below needs that, and reading it
    # off the combined action silently yields an empty string — which made the check report MISS
    # on a run that had in fact restored at a 100% ccache hit rate.
    - name: Restore FetchContent Dependencies
      id: deps-cache
      uses: actions/cache/restore@v5
      with:
        path: build/_deps
        # Keyed on the dependency pins ALONE (cmake/DependencyVersions.cmake), not on
        # CMakeLists.txt. build/_deps holds nothing but the fetched JUCE + googletest sources, so
        # adding a module to a target must not invalidate it. Keying on the whole CMakeLists (as
        # this did until Aug 2026) minted a fresh ~350 MB entry per platform per workflow on every
        # module PR — 10 CMakeLists edits in nine days, ~2.1 GB apiece, which blew past GitHub's
        # 10 GB per-repo budget and LRU-evicted every ccache entry with it.
        key: ${{ runner.os }}-deps3-${{ hashFiles('cmake/DependencyVersions.cmake') }}
        restore-keys: |
          ${{ runner.os }}-deps3-

    - name: Restore ccache
      id: ccache-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        # Exact key is per-commit (never hits) — the restore-keys are what actually match:
        # this ref's most recent entry first, then main's seeded entry, then anything.
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-ccache-main-
          ${{ runner.os }}-ccache-

    - name: Configure ccache
      run: |
        # 500M was too small to hold a Debug + coverage build of the whole tree (268 translation
        # units as of Aug 2026, up from 185 in July), so entries evicted mid-build. Kept at 2G
        # (unlike the smaller per-OS caps on the macOS/Windows jobs below): a seeded
        # Linux-ccache-main entry measured 1.96 GB on 2026-09-15 — already saturating a 1G cap —
        # because this is the Debug+coverage+AI-harness build, the heaviest of the three.
        ccache --set-config=max_size=2G
        # actions/checkout writes fresh mtimes on every file every run, and the compiler binary's
        # mtime changes whenever GitHub rebuilds the runner image — both cause false misses under
        # ccache's mtime-based defaults.
        ccache --set-config=compiler_check=content
        ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
        ccache --zero-stats

    - name: Configure CMake
      run: |
        # Use clang for consistent coverage flags
        export CC=clang
        export CXX=clang++
        # This is the ONE job that builds the Tools/ harnesses, and only to keep them compiling:
        # they gate no tests and are never run here (AIPatchHarness/AIEvalHarness need a live
        # Ollama). Each links AppUI/Core and compiles only its own Main.cpp (cmake/AiHarness.cmake),
        # so the macOS and Windows jobs leave them out — see the note in each. Keep exactly one
        # platform building them; dropping the last one means a harness can rot until someone runs
        # it by hand.
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON \
          -DENABLE_TESTS=ON \
          -DENABLE_AI_HARNESS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build

    - name: Check Cache Health
      if: always()
      env:
        CACHE_MATCHED_KEY: ${{ steps.ccache-cache.outputs.cache-matched-key }}
        DEPS_MATCHED_KEY: ${{ steps.deps-cache.outputs.cache-matched-key }}
      run: bash scripts/ci-cache-check.sh

    # Saved right after the build, `if: always()`, so a compile that succeeded is never thrown
    # away because a later test failed. `_deps` is skipped on an exact hit — re-uploading an
    # identical ~350 MB entry only burns budget.
    # Only a push-to-main run (or a workflow_dispatch run on main, see the trigger comment above)
    # saves. A PR run always restores only: every PR push used to mint its own ~350 MB deps entry
    # and ~150 MB-2 GB ccache entry under refs/pull/<n>/merge, and those PR-scoped entries were
    # never cleaned up until GC — at one point 6.3 GB of the repo's 10 GB cache budget was PR-scope
    # duplicates, LRU-evicting main's seeded entries so the NEXT PR restored nothing and failed
    # Check Cache Health by design. main is the only ref that needs to write here since every PR
    # restore-key falls back to it.
    - name: Save FetchContent Dependencies
      if: always() && steps.deps-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: build/_deps
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Save ccache
      id: ccache-save
      if: always() && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

    # ccache keys are per-commit (<os>-ccache-main-<sha>) and cache entries are immutable, so
    # every merge to main mints a brand-new one instead of updating in place — without this,
    # 3-4 merges alone would re-blow the repo past GitHub's 10 GB cache budget the same way
    # PR-scoped entries used to. `if: always()` is deliberately NOT used here: pruning only runs
    # once the save above has actually produced a new generation to keep, never on a failed or
    # skipped save (which would otherwise delete every existing generation and leave main cold).
    # Concurrency safety: main pushes are queued, not cancelled, by the concurrency group at the
    # top of this file (cancel-in-progress is pull_request-only), so two main runs never prune the
    # same OS family at once — but as a second, cheap guard, this only ever deletes entries OLDER
    # than the entry this run just saved (never "everything but mine"), and always keeps the 2
    # most recent generations regardless, so a run working off a stale cache listing can't delete
    # a sibling run's fresher save. Also prunes superseded build/_deps entries for old
    # DependencyVersions.cmake hashes, which accumulate the same way (slower cadence, same fix).
    # Tolerates a missing/partial cache listing (logs and skips rather than failing the job).
    - name: Prune superseded main cache generations
      if: github.ref == 'refs/heads/main' && steps.ccache-save.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        prune() { # prune <key-prefix> <key-just-saved>
          local prefix="$1" keep_key="$2" list keep_created
          if ! list="$(gh cache list --ref refs/heads/main --key "$prefix" --limit 100 \
                          --json id,key,createdAt 2>&1)" || [ -z "$list" ] || [ "$list" = "[]" ]; then
            echo "prune: nothing to list for $prefix (or listing failed), skipping: $list"
            return 0
          fi
          keep_created="$(printf '%s' "$list" | jq -r --arg k "$keep_key" \
                             '.[] | select(.key==$k) | .createdAt' | head -1)"
          if [ -z "$keep_created" ]; then
            echo "prune: could not find just-saved key $keep_key in the $prefix listing, skipping"
            return 0
          fi
          printf '%s' "$list" | jq -r --arg cutoff "$keep_created" \
            'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.createdAt < $cutoff) | "\(.id)\t\(.key)"' |
          while IFS=$'\t' read -r id key; do
            [ -z "$id" ] && continue
            echo "prune: deleting $prefix cache id=$id key=$key"
            gh cache delete "$id" || echo "prune: failed to delete id=$id (non-fatal)"
          done
        }
        prune "${{ runner.os }}-ccache-main-" "${{ steps.ccache-cache.outputs.cache-primary-key }}"
        prune "${{ runner.os }}-deps3-" "${{ steps.deps-cache.outputs.cache-primary-key }}"

    # Test execution, coverage and its artifact are pull-request concerns; a push run is only here
    # to seed the cache (see the note above the `lint` job).
    - name: Run Tests
      if: github.event_name == 'pull_request'
      timeout-minutes: 10
      run: |
        export LLVM_PROFILE_FILE="default.profraw"
        # Run without xvfb — tests are headless and xvfb's X11 event loop
        # adds ~44s overhead per pumpMessages() call on slow CI runners
        #
        # Watchdog: a hung test must die with thread stacks, not a silent step timeout. SIGABRT
        # after 8 minutes, then print every thread's backtrace from the core.
        sudo apt-get install -y --no-install-recommends gdb > /dev/null 2>&1 || true
        ulimit -c unlimited
        echo 'core.%p' | sudo tee /proc/sys/kernel/core_pattern > /dev/null
        set +e
        timeout -s ABRT 480 ./build/Tests/Tests
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          core=$(ls core.* 2>/dev/null | head -1)
          if [ -n "$core" ]; then
            echo "=== hang/crash backtraces ==="
            gdb -batch -ex 'thread apply all bt' ./build/Tests/Tests "$core" 2>/dev/null | tail -300
          fi
        fi
        exit $status

    - name: Check Coverage
      if: github.event_name == 'pull_request'
      run: xvfb-run bash scripts/coverage.sh --report-only

    - name: Upload Coverage Artifact (Optional)
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          default.profdata
          default.profraw

  build-and-test-asan:
    name: Build and Test (ASAN)
    if: contains(github.event.pull_request.labels.*.name, 'run-asan')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The same script as build-and-test, not awalsh128/cache-apt-pkgs-action: that action's cached
    # restore dropped libfontconfig1-dev's .pc file and .so symlink, so configure died building
    # juceaide ("libfontconfig.so ... missing and no known rule") on every labelled run (FRO269/FRO275).
    - name: Install Dependencies
      timeout-minutes: 15
      run: bash scripts/ci-install-linux-deps.sh

    # Restore-only, like every other PR-facing cache step (see the Save FetchContent Dependencies
    # comment in build-and-test above): this job only ever runs on a PR (label-gated, no push:main
    # trigger of its own), so it can never be the ref that legitimately saves. It shares the exact
    # same key as build-and-test's Linux deps cache, so it restores from that job's main-seeded
    # entry with no save step of its own needed here.
    - name: Restore FetchContent Dependencies
      uses: actions/cache/restore@v5
      with:
        path: build/_deps
        # See the build-and-test job for why this keys on the pins file alone.
        key: ${{ runner.os }}-deps3-${{ hashFiles('cmake/DependencyVersions.cmake') }}
        restore-keys: |
          ${{ runner.os }}-deps3-

    - name: Configure CMake
      run: |
        export CC=clang
        export CXX=clang++
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_TESTS=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

    - name: Build
      run: cmake --build build --target Tests

    - name: Run Tests
      run: xvfb-run ./build/Tests/Tests
      env:
        ASAN_OPTIONS: detect_leaks=0

  build-and-test-macos:
    name: Build and Test (macOS)
    runs-on: macos-latest
    # See build-and-test's permissions comment: actions: write is only for the cache-pruning step.
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v6

    # Same ceiling as the Linux job, for the same reason: a package manager with no timeout can
    # stall on a bad mirror until the 6-hour job limit rather than failing.
    - name: Install Dependencies
      timeout-minutes: 15
      run: brew install cmake ninja ccache

    # See the build-and-test job for why restore and save are split.
    - name: Restore FetchContent Dependencies
      id: deps-cache
      uses: actions/cache/restore@v5
      with:
        path: build/_deps
        # See the build-and-test job for why this keys on the pins file alone.
        key: ${{ runner.os }}-deps3-${{ hashFiles('cmake/DependencyVersions.cmake') }}
        restore-keys: |
          ${{ runner.os }}-deps3-

    - name: Restore ccache
      id: ccache-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-ccache-main-
          ${{ runner.os }}-ccache-

    - name: Configure ccache
      run: |
        # Right-sized, not the Linux job's 2G: a seeded macOS-ccache-main entry measured 117 MB on
        # 2026-09-15 (this Release build has no coverage instrumentation and is the smallest of the
        # three), so 2G was headroom this job will never use — and every byte configured here is a
        # byte a single `Save ccache` run (main-only, see that step below) could write toward the
        # repo's 10 GB cache budget. 512M leaves >4x headroom over the measured size.
        ccache --set-config=max_size=512M
        ccache --set-config=compiler_check=content
        ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
        ccache --zero-stats

    - name: Configure CMake
      run: |
        # OBJC/OBJCXX are separate CMake languages and need their own launcher. JUCE compiles each
        # of its modules as one Objective-C++ unity file per target — 103 .mm translation units in
        # this build — and without these two flags every one of them skipped ccache and was rebuilt
        # cold on every run: ~12 min of a 12 min 45 s macOS job, tailing off into a near-serial
        # chain of 20–35 s juce_gui_basics / juce_audio_processors compiles. CMakeLists.txt sets the
        # same four launchers when it finds ccache; these stay explicit to match the C/CXX flags.
        # No -DENABLE_AI_HARNESS here, deliberately: the three Tools/ harnesses are measurement
        # instruments that CI never runs (they gate no tests and need a live Ollama). One platform
        # is enough to catch a harness that stops compiling, and the Linux job builds them, so a
        # harness that stops compiling is still caught on every PR.
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build

    - name: Check Cache Health
      if: always()
      env:
        CACHE_MATCHED_KEY: ${{ steps.ccache-cache.outputs.cache-matched-key }}
        DEPS_MATCHED_KEY: ${{ steps.deps-cache.outputs.cache-matched-key }}
      run: bash scripts/ci-cache-check.sh

    # Only a push-to-main run (or a workflow_dispatch run on main, see the trigger comment above)
    # saves. A PR run always restores only: every PR push used to mint its own ~350 MB deps entry
    # and ~150 MB-2 GB ccache entry under refs/pull/<n>/merge, and those PR-scoped entries were
    # never cleaned up until GC — at one point 6.3 GB of the repo's 10 GB cache budget was PR-scope
    # duplicates, LRU-evicting main's seeded entries so the NEXT PR restored nothing and failed
    # Check Cache Health by design. main is the only ref that needs to write here since every PR
    # restore-key falls back to it.
    - name: Save FetchContent Dependencies
      if: always() && steps.deps-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: build/_deps
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Save ccache
      id: ccache-save
      if: always() && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

    # See build-and-test's "Prune superseded main cache generations" step for the full rationale
    # (per-commit ccache keys are immutable, so unpruned entries re-blow the cache budget) and its
    # concurrency-safety note (only deletes entries older than this run's own save, keeps the 2
    # most recent generations regardless, tolerates a missing/partial listing).
    - name: Prune superseded main cache generations
      if: github.ref == 'refs/heads/main' && steps.ccache-save.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        prune() { # prune <key-prefix> <key-just-saved>
          local prefix="$1" keep_key="$2" list keep_created
          if ! list="$(gh cache list --ref refs/heads/main --key "$prefix" --limit 100 \
                          --json id,key,createdAt 2>&1)" || [ -z "$list" ] || [ "$list" = "[]" ]; then
            echo "prune: nothing to list for $prefix (or listing failed), skipping: $list"
            return 0
          fi
          keep_created="$(printf '%s' "$list" | jq -r --arg k "$keep_key" \
                             '.[] | select(.key==$k) | .createdAt' | head -1)"
          if [ -z "$keep_created" ]; then
            echo "prune: could not find just-saved key $keep_key in the $prefix listing, skipping"
            return 0
          fi
          printf '%s' "$list" | jq -r --arg cutoff "$keep_created" \
            'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.createdAt < $cutoff) | "\(.id)\t\(.key)"' |
          while IFS=$'\t' read -r id key; do
            [ -z "$id" ] && continue
            echo "prune: deleting $prefix cache id=$id key=$key"
            gh cache delete "$id" || echo "prune: failed to delete id=$id (non-fatal)"
          done
        }
        prune "${{ runner.os }}-ccache-main-" "${{ steps.ccache-cache.outputs.cache-primary-key }}"
        prune "${{ runner.os }}-deps3-" "${{ steps.deps-cache.outputs.cache-primary-key }}"

    # Pull-request only — a push run seeds the cache (see the note above the `lint` job). This is
    # the starkest case: an 8-second cached build was carrying 118 seconds of test execution.
    - name: Run Tests
      if: github.event_name == 'pull_request'
      working-directory: ./build/Tests
      run: ./Tests

  build-and-test-windows:
    name: Build and Test (Windows)
    # Push-to-main and workflow_dispatch only, not pull requests (decision 2026-09-26, FRO242/FRO54):
    # this was the slowest required check on every PR -- 13m46s of build warm, 47m11s when a PR
    # touched MainComponent.h (run 36174228657) against 6-9 min for the other two platforms -- and
    # FRO242 established it could never fail on a test failure anyway (the `find -exec` below
    # swallows Tests.exe's exit status), so it gated nothing for 14-47 min per PR. It still builds
    # and runs the suite on every push to main, so a Windows-only breakage surfaces on main's run
    # and in the release build (build-artifacts.yml) rather than never; it is no longer a
    # required status check (branch protection lists five). Making the exit status honest, and
    # dealing with the 20 paint/render tests it currently hides, is FRO242.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # See build-and-test's permissions comment: actions: write is only for the cache-pruning step.
    permissions:
      contents: read
      actions: write
    env:
      # Overrides the workflow-level default. `github.workspace` on Windows is a backslash path
      # (D:\a\agentsynth\agentsynth), and these steps run under bash, where backslashes in a
      # quoted string survive as literals and break `mkdir -p`. This forward-slash absolute path
      # is the one the job used before and is known to work with both bash and actions/cache.
      CCACHE_DIR: C:/Users/runneradmin/AppData/Local/ccache

    steps:
    - uses: actions/checkout@v6

    # See the build-and-test job for why restore and save are split.
    - name: Restore FetchContent Dependencies
      id: deps-cache
      uses: actions/cache/restore@v5
      with:
        path: build/_deps
        # See the build-and-test job for why this keys on the pins file alone.
        key: ${{ runner.os }}-deps3-${{ hashFiles('cmake/DependencyVersions.cmake') }}
        restore-keys: |
          ${{ runner.os }}-deps3-

    - name: Restore ccache
      id: ccache-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-ccache-main-
          ${{ runner.os }}-ccache-

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure ccache
      shell: bash
      run: |
        mkdir -p "$CCACHE_DIR"
        # Right-sized, not the Linux job's 2G: a seeded Windows-ccache-main entry measured 160 MB
        # on 2026-09-15, so 512M leaves >3x headroom while bounding what a single main-only save
        # (see the Save ccache step below) can add to the repo's 10 GB cache budget.
        ccache --set-config=max_size=512M
        ccache --set-config=compiler_check=content
        ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
        ccache --zero-stats

    - name: Configure CMake
      shell: bash
      run: |
        # No -DENABLE_AI_HARNESS here — same reasoning as the macOS job above. The Linux job keeps
        # building the harnesses for compile coverage.
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build --config Release

    - name: Check Cache Health
      if: always()
      shell: bash
      env:
        CACHE_MATCHED_KEY: ${{ steps.ccache-cache.outputs.cache-matched-key }}
        DEPS_MATCHED_KEY: ${{ steps.deps-cache.outputs.cache-matched-key }}
      run: bash scripts/ci-cache-check.sh

    # Only a push-to-main run (or a workflow_dispatch run on main, see the trigger comment above)
    # saves. A PR run always restores only: every PR push used to mint its own ~350 MB deps entry
    # and ~150 MB-2 GB ccache entry under refs/pull/<n>/merge, and those PR-scoped entries were
    # never cleaned up until GC — at one point 6.3 GB of the repo's 10 GB cache budget was PR-scope
    # duplicates, LRU-evicting main's seeded entries so the NEXT PR restored nothing and failed
    # Check Cache Health by design. main is the only ref that needs to write here since every PR
    # restore-key falls back to it.
    - name: Save FetchContent Dependencies
      if: always() && steps.deps-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: build/_deps
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Save ccache
      id: ccache-save
      if: always() && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

    # See build-and-test's "Prune superseded main cache generations" step for the full rationale
    # and concurrency-safety note. shell: bash because this job's default shell is pwsh.
    - name: Prune superseded main cache generations
      if: github.ref == 'refs/heads/main' && steps.ccache-save.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        prune() { # prune <key-prefix> <key-just-saved>
          local prefix="$1" keep_key="$2" list keep_created
          if ! list="$(gh cache list --ref refs/heads/main --key "$prefix" --limit 100 \
                          --json id,key,createdAt 2>&1)" || [ -z "$list" ] || [ "$list" = "[]" ]; then
            echo "prune: nothing to list for $prefix (or listing failed), skipping: $list"
            return 0
          fi
          keep_created="$(printf '%s' "$list" | jq -r --arg k "$keep_key" \
                             '.[] | select(.key==$k) | .createdAt' | head -1)"
          if [ -z "$keep_created" ]; then
            echo "prune: could not find just-saved key $keep_key in the $prefix listing, skipping"
            return 0
          fi
          printf '%s' "$list" | jq -r --arg cutoff "$keep_created" \
            'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.createdAt < $cutoff) | "\(.id)\t\(.key)"' |
          while IFS=$'\t' read -r id key; do
            [ -z "$id" ] && continue
            echo "prune: deleting $prefix cache id=$id key=$key"
            gh cache delete "$id" || echo "prune: failed to delete id=$id (non-fatal)"
          done
        }
        prune "${{ runner.os }}-ccache-main-" "${{ steps.ccache-cache.outputs.cache-primary-key }}"
        prune "${{ runner.os }}-deps3-" "${{ steps.deps-cache.outputs.cache-primary-key }}"

    # Runs on every push to main (this job no longer runs on pull requests, see its `if:`), so main
    # keeps a Windows test signal. Advisory until FRO242: GNU find's exit status never reflects the
    # command run by -exec, so a failing Tests.exe cannot fail this step.
    - name: Run Tests
      shell: bash
      run: |
        find build -name "Tests.exe" -exec {} \;
